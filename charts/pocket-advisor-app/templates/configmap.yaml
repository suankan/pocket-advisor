apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "pocket-advisor-app.name" . }}-gateway
  labels:
    {{- include "pocket-advisor-app.labels" . | nindent 4 }}
data:
  Caddyfile: |
    {
    	admin off
    	auto_https off
    }
    :8443 {
    	log {
    		output discard
    	}
    	tls /tls/tls.crt /tls/tls.key
    	request_body {
    		max_size 1MB
    	}
    	reverse_proxy 127.0.0.1:8080 {
    		header_up Host {host}
    		header_up X-Forwarded-Proto https
    		transport http {
    			dial_timeout 5s
    			response_header_timeout 125s
    		}
    	}
    }
