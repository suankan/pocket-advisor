{{- $workspaceID := required "workspace.id is required" .Values.workspace.id -}}
{{- $configurationSecret := required "workspace.configurationSecret is required" .Values.workspace.configurationSecret -}}
{{- $publicURI := required "mcp.publicURI is required" .Values.mcp.publicURI -}}
{{- $issuer := required "oauth.authorizationServer is required" .Values.oauth.authorizationServer -}}
{{- $introspection := required "oauth.introspectionEndpoint is required" .Values.oauth.introspectionEndpoint -}}
{{- $clientID := required "oauth.introspectionClientID is required" .Values.oauth.introspectionClientID -}}
{{- $authSecret := required "oauth.secretName is required" .Values.oauth.secretName -}}
{{- $tlsSecret := required "tls.secretName is required" .Values.tls.secretName -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "pocket-advisor-app.name" . }}
  labels:
    {{- include "pocket-advisor-app.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        {{- include "pocket-advisor-app.labels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: pocket-advisor
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --mcp-http
            - --workspace-id
            - {{ $workspaceID | quote }}
            - --config
            - /config/config.yaml
            - --workspace-config
            - /config/workspace-config.yaml
            - --mcp-http-addr
            - 127.0.0.1:8080
            - --mcp-http-resource-uri
            - {{ $publicURI | quote }}
            - --mcp-http-authorization-server
            - {{ $issuer | quote }}
            - --mcp-http-introspection-endpoint
            - {{ $introspection | quote }}
            - --mcp-http-introspection-client-id
            - {{ $clientID | quote }}
            - --mcp-http-required-scope
            - {{ .Values.mcp.requiredScope | quote }}
            - --mcp-http-allowed-origins
            - {{ .Values.mcp.allowedOrigins | quote }}
            - --mcp-http-allowed-hosts
            - {{ .Values.mcp.allowedHosts | quote }}
            - --mcp-http-trusted-proxy-cidrs
            - 127.0.0.0/8,::1/128
            - --mcp-http-max-concurrent
            - {{ .Values.mcp.maxConcurrent | quote }}
          env:
            - name: MCP_HTTP_INTROSPECTION_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ $authSecret }}
                  key: {{ .Values.oauth.secretKey }}
            - name: WORKSPACES_CONFIG
              value: /config/workspace-config.yaml
            - name: WORKSPACES_VALUES
              value: /config/workspace-values.yaml
            {{- range .Values.extraEnv }}
            - name: {{ .name | quote }}
              value: {{ .value | quote }}
            {{- end }}
          ports:
            - name: backend
              containerPort: 8080
          volumeMounts:
            - name: configuration
              mountPath: /config/config.yaml
              subPath: {{ .Values.workspace.configurationKey }}
              readOnly: true
            - name: configuration
              mountPath: /config/workspace-config.yaml
              subPath: {{ .Values.workspace.registryKey }}
              readOnly: true
            - name: configuration
              mountPath: /config/workspace-values.yaml
              subPath: {{ .Values.workspace.valuesKey }}
              readOnly: true
            {{- range .Values.extraVolumeMounts }}
            - name: {{ .name | quote }}
              mountPath: {{ .mountPath | quote }}
              readOnly: true
            {{- end }}
          securityContext:
            runAsUser: 65532
            runAsGroup: 65532
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          readinessProbe:
            exec:
              command: ["curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:8080/readyz"]
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:8080/livez"]
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
        - name: gateway
          image: {{ .Values.caddy.image }}
          args: ["caddy", "run", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile"]
          ports:
            - name: https
              containerPort: 8443
          volumeMounts:
            - name: gateway
              mountPath: /etc/caddy
              readOnly: true
            - name: tls
              mountPath: /tls
              readOnly: true
            - name: caddy-data
              mountPath: /data
            - name: caddy-config
              mountPath: /config
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              # The caddy:*-alpine image ships /usr/bin/caddy with the file
              # capability cap_net_bind_service=ep; with an empty bounding
              # set the kernel refuses to exec it ("operation not permitted").
              add: ["NET_BIND_SERVICE"]
            readOnlyRootFilesystem: true
          readinessProbe:
            tcpSocket:
              port: https
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: https
            periodSeconds: 10
      volumes:
        - name: configuration
          secret:
            secretName: {{ $configurationSecret }}
        - name: gateway
          configMap:
            name: {{ include "pocket-advisor-app.name" . }}-gateway
        - name: tls
          secret:
            secretName: {{ $tlsSecret }}
        - name: caddy-data
          emptyDir: {}
        - name: caddy-config
          emptyDir: {}
        {{- range .Values.extraVolumes }}
        - name: {{ .name | quote }}
          secret:
            secretName: {{ .secretName | quote }}
        {{- end }}
