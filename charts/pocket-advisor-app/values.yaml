image:
  repository: pocket-advisor
  tag: local
  pullPolicy: IfNotPresent

caddy:
  image: caddy:2.10.2-alpine

# One release serves exactly one workspace. All named Secrets are created by
# the operator outside this chart so no private identity, path, endpoint, or
# credential enters version control.
workspace:
  id: ""
  configurationSecret: ""
  configurationKey: config.yaml
  registryKey: workspace-config.yaml
  valuesKey: workspace-values.yaml

mcp:
  publicURI: ""
  allowedOrigins: ""
  allowedHosts: ""
  requiredScope: pocket-advisor:retrieve
  maxConcurrent: 8

oauth:
  authorizationServer: ""
  introspectionEndpoint: ""
  introspectionClientID: ""
  secretName: ""
  secretKey: introspection-client-secret

tls:
  # A kubernetes.io/tls Secret provisioned and rotated outside this chart.
  secretName: ""

service:
  # ClusterIP is safe by default. Use LoadBalancer only with explicit source
  # ranges and the public DNS name covered by tls.secretName.
  type: ClusterIP
  loadBalancerSourceRanges: []

networkPolicy:
  enabled: true
  # CIDRs permitted to reach the Caddy TLS port. Empty means namespace-local
  # pods only; a remote LoadBalancer deployment must set explicit CIDRs.
  ingressCIDRs: []
  # Egress is deny-by-default except DNS. Add only the selected PostgreSQL,
  # model, and authorization-server CIDR/port pairs for this workspace.
  egress: []
  # - cidr: 192.0.2.10/32
  #   ports: [5432]

resources: {}
