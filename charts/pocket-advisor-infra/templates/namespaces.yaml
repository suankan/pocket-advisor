{{/*
A namespace per workspace, rendered by this chart rather than created by
`helm --create-namespace`.

One release manages every workspace, but each workspace's resources still live
in a namespace of their own — so the namespaces have to be release-owned
objects like everything else. That also makes removal complete: dropping a
workspace from the values file and upgrading takes its namespace, and
therefore its volumes, with it.

The release itself lives elsewhere (see the Makefile), because a release
cannot live in three namespaces at once.
*/}}
{{- range $.Values.workspaces }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .id }}
  labels:
    {{- include "pa.labels" (dict "ctx" $) | nindent 4 }}
    pocket-advisor/workspace: {{ .id | quote }}
  {{- with include "pa.annotations" (dict "ctx" $ "description" (printf "Everything belonging to workspace %s" .id)) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
{{- end }}
