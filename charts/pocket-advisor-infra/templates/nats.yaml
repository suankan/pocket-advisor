{{/*
One NATS server for the whole cluster, fully open: no accounts, no users, no
password — the same bare-flags-equivalent state NATS started in before this
file existed, restored deliberately rather than by omission.

This is a fully local, single-operator system. Isolation moved from NATS
accounts (a hard partition, and real protection against another tenant on
the same server) to subject and stream naming instead: every subject and
stream name internal/bus/bus.go uses is namespaced by workspace id
(`<id>.ingest.emails.raw`, `INGESTION_<SUFFIX>`, ...), which keeps
workspaces from colliding with each other but — unlike accounts — is
convention, not an enforced boundary; there is no threat model here that
needs one.

Rendered once, into the release namespace, rather than once per workspace.
Streams are data on the (single, global) account, created by
deploy-workspace over natscli — nothing about them lives in this static
config, so unlike before, adding or removing a workspace changes nothing
here and needs no pod restart.

Named plainly `nats`, without the release prefix. It is the only NATS in the
cluster and its namespace holds nothing else of its kind, so the prefix added
length without distinguishing anything — the same reasoning that names the
operator subcharts after themselves.
*/}}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nats-config
  labels:
    {{- include "pa.labels" (dict "ctx" $ "component" "message-bus") | nindent 4 }}
  {{- with include "pa.annotations" (dict "ctx" $ "description" "NATS server config") }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
data:
  nats-server.conf: |
    port: {{ $.Values.nats.clientPort }}
    http: {{ $.Values.nats.monitorPort }}

    jetstream {
      store_dir: /data
    }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: nats
  labels:
    {{- include "pa.labels" (dict "ctx" $ "component" "message-bus") | nindent 4 }}
  {{- with include "pa.annotations" (dict "ctx" $ "description" "NATS JetStream — the queues between pipeline worker pools") }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
spec:
  serviceName: nats
  replicas: {{ $.Values.nats.replicaCount }}
  selector:
    matchLabels:
      app: nats
  template:
    metadata:
      labels:
        app: nats
    spec:
      containers:
        - name: nats
          image: {{ $.Values.nats.image }}
          command:
            - nats-server
            - "-c"
            - "/etc/nats/nats-server.conf"
          ports:
            - containerPort: {{ $.Values.nats.clientPort }}
            - containerPort: {{ $.Values.nats.monitorPort }}
          # No resources block, deliberately: everything in this namespace
          # competes freely over the OrbStack VM's fixed 4GB/4CPU ceiling
          # rather than each holding its own reservation inside it
          # (values.yaml has the full account).
          volumeMounts:
            - name: nats-data
              mountPath: /data
            - name: nats-config
              mountPath: /etc/nats
              readOnly: true
      volumes:
        - name: nats-config
          configMap:
            name: nats-config
  volumeClaimTemplates:
    - metadata:
        name: nats-data
      spec:
        accessModes: [ "ReadWriteOnce" ]
        resources:
          requests:
            storage: {{ $.Values.nats.persistence.size }}
---
apiVersion: v1
kind: Service
metadata:
  name: nats
  labels:
    {{- include "pa.labels" (dict "ctx" $ "component" "message-bus") | nindent 4 }}
  {{- with include "pa.annotations" (dict "ctx" $ "description" "Cluster-internal endpoint for the NATS client and monitoring ports") }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
spec:
  type: ClusterIP
  ports:
    - port: {{ $.Values.nats.clientPort }}
      targetPort: {{ $.Values.nats.clientPort }}
      name: client
    - port: {{ $.Values.nats.monitorPort }}
      targetPort: {{ $.Values.nats.monitorPort }}
      name: monitor
  selector:
    app: nats
