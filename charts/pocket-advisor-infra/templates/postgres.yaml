{{/*
One CloudNativePG Cluster, shared by every workspace — reverted from one
cluster per workspace (ingestion-design.md deviation 34). Each workspace gets
its own logical database and role inside this cluster instead, declared in
postgres-workspaces.yaml.

`Database` and `DatabaseRole` reference their `Cluster` by name only — no
namespace field, so per Kubernetes convention that means "same namespace as
the object doing the referencing." That is why this Cluster, and every
workspace's Database/DatabaseRole/credentials Secret, live in the shared
release namespace rather than each workspace's own namespace: RustFS and NATS
keep their per-workspace-namespace isolation (workspace-isolation.md §2.2,
§2.3); Postgres no longer does.

The bootstrap database below is a CNPG requirement, not a real one: initdb
needs *some* database and owner at cluster creation. Nothing in this
application ever connects to it — every real database is a Database CRD,
created after the cluster already exists, and gets its own extensions
declared there rather than here.
*/}}
apiVersion: v1
kind: Secret
metadata:
  namespace: {{ $.Values.global.namespace }}
  name: postgres-bootstrap
  labels:
    {{- include "pa.labels" (dict "ctx" $ "component" "database") | nindent 4 }}
  {{- with include "pa.annotations" (dict "ctx" $ "description" "Bootstrap credentials CNPG requires at cluster creation; unused by the application") }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
# basic-auth is the shape CNPG's bootstrap.initdb.secret expects; it reads
# username and password from these exact keys.
type: kubernetes.io/basic-auth
stringData:
  username: {{ $.Values.postgres.bootstrapUser | quote }}
  password: {{ required "postgres.credentials.bootstrapPassword is required" $.Values.postgres.credentials.bootstrapPassword | quote }}
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  namespace: {{ $.Values.global.namespace }}
  name: {{ $.Values.postgres.clusterName }}
  labels:
    {{- include "pa.labels" (dict "ctx" $ "component" "database") | nindent 4 }}
  {{- with include "pa.annotations" (dict "ctx" $ "description" "Shared Postgres cluster; every workspace's database and role live inside it") }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
spec:
  # One. This is a single-node local cluster, so replicas would contend for
  # the same disk and the same page cache while buying no availability.
  instances: {{ $.Values.postgres.instances }}
  imageName: {{ $.Values.postgres.image }}

  # pg_textsearch must be preloaded, not just CREATE EXTENSION'd — it installs
  # hooks the server only picks up at start. The operator writes this into
  # postgresql.conf before the first start, so it's already in effect by the
  # time any workspace's Database CRD runs CREATE EXTENSION.
  postgresql:
    shared_preload_libraries:
      - pg_textsearch

  bootstrap:
    initdb:
      # Not `postgres`: that database already exists, owned by the superuser,
      # and the operator will not reassign it. Measured rather than assumed —
      # a cluster bootstrapped with database: postgres comes up healthy and
      # then refuses the first CREATE TABLE with "permission denied for schema
      # public", because the bootstrap owner owns nothing in it.
      database: {{ $.Values.postgres.bootstrapUser | quote }}
      owner: {{ $.Values.postgres.bootstrapUser | quote }}
      secret:
        name: postgres-bootstrap

  storage:
    size: {{ $.Values.postgres.storage.size }}

  resources:
    {{- toYaml $.Values.postgres.resources | nindent 4 }}
