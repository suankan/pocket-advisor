{{/*
Postgres as a plain StatefulSet — no CloudNativePG, no Cluster CRD
(deviation 39). One shared instance, same as the Cluster it replaces
(deviation 34); what changed is who drives it.

The image is built from CloudNativePG's own base
(docker-images/postgres/Dockerfile), for pg_textsearch — but that base has
no docker-entrypoint.sh and no auto-init the way the official postgres image
does: it was built for CNPG's instance-manager to drive, not to run
standalone. Checked directly: `Entrypoint: null`, `Cmd: ["bash"]`, nothing
else. The ConfigMap below is a from-scratch replacement, tested end to end
against the real image before being trusted here — two things it would have
been easy to get wrong and ship anyway:

  * UTF8/C.utf8 explicitly. initdb's own default, unset, is SQL_ASCII/"C" —
    silently wrong for the bilingual English/Russian corpus, and not the
    kind of wrong anything would fail loudly on.
  * pg_hba.conf given an explicit host-network entry. initdb's own generated
    one only ever covers loopback, so a pod connecting from anywhere else on
    the cluster network — which is every real connection this server will
    ever receive — would be refused with no pg_hba entry to match at all,
    not a permission error pointing at the cause.
*/}}
---
apiVersion: v1
kind: Secret
metadata:
  namespace: {{ $.Values.global.namespace }}
  name: postgres-admin
  labels:
    {{- include "pa.labels" (dict "ctx" $ "component" "database") | nindent 4 }}
  {{- with include "pa.annotations" (dict "ctx" $ "description" "Postgres admin credentials — ./pocket-advisor.sh deploy-workspace uses these to provision each workspace") }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
type: Opaque
stringData:
  username: {{ required "postgres.adminPostgresUser is required" $.Values.postgres.adminPostgresUser | quote }}
  password: {{ required "postgres.adminPostgresPassword is required" $.Values.postgres.adminPostgresPassword | quote }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  namespace: {{ $.Values.global.namespace }}
  name: postgres-entrypoint
  labels:
    {{- include "pa.labels" (dict "ctx" $ "component" "database") | nindent 4 }}
data:
  entrypoint.sh: |
    #!/bin/bash
    set -euo pipefail
    export PGDATA=/var/lib/postgresql/data/pgdata
    if [ ! -s "$PGDATA/PG_VERSION" ]; then
      echo "initializing database at $PGDATA"
      mkdir -p "$PGDATA"
      echo -n "$POSTGRES_PASSWORD" > /tmp/pwfile
      initdb -D "$PGDATA" -U "$POSTGRES_USER" --pwfile=/tmp/pwfile \
        --encoding=UTF8 --locale=C.utf8 \
        --auth-host=scram-sha-256 --auth-local=trust
      rm -f /tmp/pwfile
      echo "listen_addresses = '*'" >> "$PGDATA/postgresql.conf"
      echo "shared_preload_libraries = 'pg_textsearch'" >> "$PGDATA/postgresql.conf"
      echo "host all all 0.0.0.0/0 scram-sha-256" >> "$PGDATA/pg_hba.conf"
      echo "host all all ::/0 scram-sha-256" >> "$PGDATA/pg_hba.conf"
    else
      echo "database already initialized, skipping initdb"
    fi
    exec postgres -D "$PGDATA"
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  namespace: {{ $.Values.global.namespace }}
  name: postgres
  labels:
    {{- include "pa.labels" (dict "ctx" $ "component" "database") | nindent 4 }}
  {{- with include "pa.annotations" (dict "ctx" $ "description" "Shared Postgres — Tier 2/3, every workspace's database and role live inside it") }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: {{ $.Values.postgres.image }}
          command: ["bash", "/scripts/entrypoint.sh"]
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-admin
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-admin
                  key: password
          ports:
            - containerPort: {{ $.Values.postgres.port }}
          # No resources block, deliberately — see global.resourcePolicy.
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
            - name: postgres-entrypoint
              mountPath: /scripts
              readOnly: true
      volumes:
        - name: postgres-entrypoint
          configMap:
            name: postgres-entrypoint
            defaultMode: 0555
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ $.Values.postgres.storage.size }}
---
apiVersion: v1
kind: Service
metadata:
  namespace: {{ $.Values.global.namespace }}
  name: postgres
  labels:
    {{- include "pa.labels" (dict "ctx" $ "component" "database") | nindent 4 }}
  {{- with include "pa.annotations" (dict "ctx" $ "description" "Cluster-internal endpoint for Postgres") }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
spec:
  type: ClusterIP
  ports:
    - port: {{ $.Values.postgres.port }}
      targetPort: {{ $.Values.postgres.port }}
      name: postgres
  selector:
    app: postgres
