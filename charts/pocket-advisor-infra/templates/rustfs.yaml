{{/*
RustFS as a plain StatefulSet — no rustfs-operator, no Tenant CRD
(deviation 39). One shared instance, same as the Tenant it replaces
(deviation 35); what changed is who creates buckets and policies. That was
already partly true before this deviation — the Tenant CRD never expressed
bucket-notification bindings either — and now covers all of it:
./pocket-advisor.sh deploy-workspace creates the bucket and its public
policy (aws-cli) and the notification binding (aws-cli, unchanged from
deviation 35). There is no per-workspace identity any more: a workspace's
bucket carries a public policy scoped to itself, so the application connects
anonymously and isolation is the bucket name, not a credential.

Root credentials, hardcoded: `admin`/`admin`, a fixed convention for this
fully local, single-operator system rather than a generated secret. RustFS's
own container requires RUSTFS_ACCESS_KEY/RUSTFS_SECRET_KEY to boot at all —
verified directly against this exact image (beta.12) rather than trusted
from docs, a known upstream issue reports them not taking effect in some
deployment modes, and this is not that one — and creating a bucket plus its
policy still needs an identity to do it with, so this is the one credential
that cannot go away, only stop being a secret worth protecting.

NATS notify targets connect anonymously too (no NATS credential exists any
more — internal/bus/bus.go), so there is no per-workspace notify identity or
Secret here either.
*/}}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  namespace: {{ $.Values.global.namespace }}
  name: rustfs
  labels:
    {{- include "pa.labels" (dict "ctx" $ "component" "object-store") | nindent 4 }}
  {{- with include "pa.annotations" (dict "ctx" $ "description" "Shared object storage — Tier 1, the corpus source of truth for every workspace") }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
spec:
  serviceName: rustfs
  replicas: 1
  selector:
    matchLabels:
      app: rustfs
  template:
    metadata:
      labels:
        app: rustfs
    spec:
      containers:
        - name: rustfs
          image: {{ $.Values.rustfs.image }}
          env:
            # Fixed convention, not a generated secret — see the file header.
            - name: RUSTFS_ACCESS_KEY
              value: admin
            - name: RUSTFS_SECRET_KEY
              value: admin
            - name: RUSTFS_VOLUMES
              value: /data
            - name: RUSTFS_ADDRESS
              value: {{ printf ":%d" (int $.Values.rustfs.apiPort) | quote }}
            # Bucket notifications, configured entirely through the
            # environment because RustFS reads its notify target at startup
            # and madmin's SetConfigKV crashes the server (§5.2). One full
            # block per workspace, connecting anonymously (no NATS credential
            # exists any more) but still to its own namespaced subject and
            # stream — internal/bus/bus.go applies the identical
            # hyphen-to-underscore, uppercased suffix transform on the Go
            # side, and pocket-advisor.sh's `nats stream add` must create the
            # stream under that same name for this target to have anywhere
            # to publish into.
            #
            # RUSTFS_NOTIFY_ENABLE is the master switch for the whole notify
            # subsystem, separate from (and in addition to) each target's own
            # RUSTFS_NOTIFY_NATS_ENABLE_<SUFFIX> below — without it RustFS
            # registers no targets at all and every PutBucketNotification-
            # Configuration call fails with "No notify targets configured",
            # regardless of how many per-target env vars are set (found live,
            # deviation 41). Gated on there being at least one workspace, the
            # same as the per-target block it precedes.
            {{- if $.Values.workspaces }}
            - name: RUSTFS_NOTIFY_ENABLE
              value: "true"
            {{- end }}
            {{- range $.Values.workspaces }}
            {{- $suffix := .id | replace "-" "_" | upper }}
            - name: RUSTFS_NOTIFY_NATS_ENABLE_{{ $suffix }}
              value: "on"
            - name: RUSTFS_NOTIFY_NATS_ADDRESS_{{ $suffix }}
              value: {{ printf "nats.%s.svc.cluster.local:%d" $.Values.global.namespace (int $.Values.nats.clientPort) | quote }}
            - name: RUSTFS_NOTIFY_NATS_SUBJECT_{{ $suffix }}
              value: {{ printf "%s.%s" .id $.Values.rustfs.notify.subject | quote }}
            - name: RUSTFS_NOTIFY_NATS_JETSTREAM_ENABLE_{{ $suffix }}
              value: "on"
            - name: RUSTFS_NOTIFY_NATS_JETSTREAM_STREAM_NAME_{{ $suffix }}
              value: {{ printf "%s_%s" $.Values.rustfs.notify.jetstreamStreamName $suffix | quote }}
            - name: RUSTFS_NOTIFY_NATS_QUEUE_DIR_{{ $suffix }}
              value: {{ printf "%s/%s" $.Values.rustfs.notify.queueDir .id | quote }}
            {{- end }}
          ports:
            - containerPort: {{ $.Values.rustfs.apiPort }}
          # No resources block, deliberately — see global.resourcePolicy.
          volumeMounts:
            - name: rustfs-data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: rustfs-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ $.Values.rustfs.persistence.size }}
---
apiVersion: v1
kind: Service
metadata:
  namespace: {{ $.Values.global.namespace }}
  name: rustfs
  labels:
    {{- include "pa.labels" (dict "ctx" $ "component" "object-store") | nindent 4 }}
  {{- with include "pa.annotations" (dict "ctx" $ "description" "Cluster-internal S3 endpoint for RustFS") }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
spec:
  type: ClusterIP
  ports:
    - port: {{ $.Values.rustfs.apiPort }}
      targetPort: {{ $.Values.rustfs.apiPort }}
      name: s3
  selector:
    app: rustfs
