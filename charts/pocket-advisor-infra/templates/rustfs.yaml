{{/*
RustFS as a plain StatefulSet — no rustfs-operator, no Tenant CRD
(deviation 39). One shared instance, same as the Tenant it replaces
(deviation 35); what changed is who creates buckets, identities and
policies. That was already partly true before this deviation — the Tenant
CRD never expressed bucket-notification bindings either — and now covers
all of it: ./pocket-advisor.sh deploy-workspace creates the bucket (aws-cli), the identity
and its policy (rc admin, since that is RustFS's own IAM-style admin API,
not something aws-cli's S3-only surface can reach at all — checked directly,
not assumed: `aws s3api put-bucket-policy` rejects the same policy document
`rc admin policy create` accepts, because bucket resource policies and IAM
canned policies are different mechanisms with different required shapes),
and the notification binding (aws-cli, unchanged from deviation 35).

Root credentials only, here: RUSTFS_ACCESS_KEY/RUSTFS_SECRET_KEY, verified
directly against this exact image (beta.12) rather than trusted from
docs — a known upstream issue reports them not taking effect in some
deployment modes, and this is not that one.
*/}}
---
apiVersion: v1
kind: Secret
metadata:
  namespace: {{ $.Values.global.namespace }}
  name: rustfs-root
  labels:
    {{- include "pa.labels" (dict "ctx" $ "component" "object-store") | nindent 4 }}
  {{- with include "pa.annotations" (dict "ctx" $ "description" "RustFS root credentials — ./pocket-advisor.sh deploy-workspace uses these to provision each workspace") }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
type: Opaque
stringData:
  accesskey: {{ required "rustfs.adminRustFSUser is required" $.Values.rustfs.adminRustFSUser | quote }}
  secretkey: {{ required "rustfs.adminRustFSPassword is required" $.Values.rustfs.adminRustFSPassword | quote }}
{{- range $.Values.workspaces }}
---
apiVersion: v1
kind: Secret
metadata:
  namespace: {{ $.Values.global.namespace }}
  name: {{ .id }}-rustfs-notify
  labels:
    {{- include "pa.labels" (dict "ctx" $ "component" "object-store") | nindent 4 }}
  {{- with include "pa.annotations" (dict "ctx" $ "description" (printf "The NATS identity this workspace's RustFS notifications publish as" .id)) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
type: Opaque
stringData:
  # A NATS username, not a workspace id — those were the same string until the
  # account naming changed, and the stale key name silently broke publishing
  # (deviation 21).
  nats-user: {{ .id | quote }}
  nats-password: {{ required (printf "workspaces[%s].nats.password is required" .id) .nats.password | quote }}
{{- end }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  namespace: {{ $.Values.global.namespace }}
  name: rustfs
  labels:
    {{- include "pa.labels" (dict "ctx" $ "component" "object-store") | nindent 4 }}
  {{- with include "pa.annotations" (dict "ctx" $ "description" "Shared object storage — Tier 1, the corpus source of truth for every workspace") }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
spec:
  serviceName: rustfs
  replicas: 1
  selector:
    matchLabels:
      app: rustfs
  template:
    metadata:
      labels:
        app: rustfs
    spec:
      containers:
        - name: rustfs
          image: {{ $.Values.rustfs.image }}
          env:
            - name: RUSTFS_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: rustfs-root
                  key: accesskey
            - name: RUSTFS_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: rustfs-root
                  key: secretkey
            - name: RUSTFS_VOLUMES
              value: /data
            - name: RUSTFS_ADDRESS
              value: {{ printf ":%d" (int $.Values.rustfs.apiPort) | quote }}
            # Bucket notifications, configured entirely through the
            # environment because RustFS reads its notify target at startup
            # and madmin's SetConfigKV crashes the server (§5.2). One full
            # block per workspace: before, "the server's one NATS identity"
            # and "the workspace's identity" were the same fact, because
            # each workspace had its own server; one shared server needs a
            # full credential set per workspace to keep publishing under the
            # right NATS account (deviation 35 has the complete account,
            # including the hyphen/underscore suffix transform and why each
            # target gets its own queue dir).
            #
            # RUSTFS_NOTIFY_ENABLE is the master switch for the whole notify
            # subsystem, separate from (and in addition to) each target's own
            # RUSTFS_NOTIFY_NATS_ENABLE_<SUFFIX> below — without it RustFS
            # registers no targets at all and every PutBucketNotification-
            # Configuration call fails with "No notify targets configured",
            # regardless of how many per-target env vars are set (found live,
            # deviation 41). Gated on there being at least one workspace, the
            # same as the per-target block it precedes.
            {{- if $.Values.workspaces }}
            - name: RUSTFS_NOTIFY_ENABLE
              value: "true"
            {{- end }}
            {{- range $.Values.workspaces }}
            {{- $suffix := .id | replace "-" "_" | upper }}
            - name: RUSTFS_NOTIFY_NATS_ENABLE_{{ $suffix }}
              value: "on"
            - name: RUSTFS_NOTIFY_NATS_ADDRESS_{{ $suffix }}
              value: {{ printf "nats.%s.svc.cluster.local:%d" $.Values.global.namespace (int $.Values.nats.clientPort) | quote }}
            - name: RUSTFS_NOTIFY_NATS_SUBJECT_{{ $suffix }}
              value: {{ $.Values.rustfs.notify.subject | quote }}
            - name: RUSTFS_NOTIFY_NATS_JETSTREAM_ENABLE_{{ $suffix }}
              value: "on"
            - name: RUSTFS_NOTIFY_NATS_JETSTREAM_STREAM_NAME_{{ $suffix }}
              value: {{ $.Values.rustfs.notify.jetstreamStreamName | quote }}
            - name: RUSTFS_NOTIFY_NATS_QUEUE_DIR_{{ $suffix }}
              value: {{ printf "%s/%s" $.Values.rustfs.notify.queueDir .id | quote }}
            - name: RUSTFS_NOTIFY_NATS_USERNAME_{{ $suffix }}
              valueFrom:
                secretKeyRef:
                  name: {{ .id }}-rustfs-notify
                  key: nats-user
            - name: RUSTFS_NOTIFY_NATS_PASSWORD_{{ $suffix }}
              valueFrom:
                secretKeyRef:
                  name: {{ .id }}-rustfs-notify
                  key: nats-password
            {{- end }}
          ports:
            - containerPort: {{ $.Values.rustfs.apiPort }}
          # No resources block, deliberately — see global.resourcePolicy.
          volumeMounts:
            - name: rustfs-data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: rustfs-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ $.Values.rustfs.persistence.size }}
---
apiVersion: v1
kind: Service
metadata:
  namespace: {{ $.Values.global.namespace }}
  name: rustfs
  labels:
    {{- include "pa.labels" (dict "ctx" $ "component" "object-store") | nindent 4 }}
  {{- with include "pa.annotations" (dict "ctx" $ "description" "Cluster-internal S3 endpoint for RustFS") }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
spec:
  type: ClusterIP
  ports:
    - port: {{ $.Values.rustfs.apiPort }}
      targetPort: {{ $.Values.rustfs.apiPort }}
      name: s3
  selector:
    app: rustfs
