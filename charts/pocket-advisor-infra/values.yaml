# ============================================================================
# Global & Environment Settings
# ============================================================================
global:
  namespace: pocket-advisor
  environment: local
  logLevel: info

# ============================================================================
# Tier 1: RustFS Object Storage — the SOLE source of truth
#
# User filesystems are a staging feed into this bucket, never read by the
# system itself (ingestion-design.md §5.1).
#
# Migrated from MinIO: MinIO's Community Edition has been progressively
# stripped of features since mid-2025 and the project archived in Feb 2026.
# RustFS is Apache-2.0 and deliberately implements MinIO's admin wire
# protocol (/minio/admin/v3), so `mc admin` tooling and our whole scoped-
# identity model carry over unchanged.
#
# Pinned to beta.12, not latest: beta.9 introduced a boot-order race where
# init_event_notifier() unconditionally refreshed notify config from storage
# before checking whether notify was even enabled, throwing "storage layer
# not initialized" whenever storage wasn't ready yet at that exact moment.
# Fixed in beta.12 (rustfs/rustfs commit 775279b6f, "defer disabled bootstrap
# storage refresh") for the disabled-notify case; beta.9-beta.11 still carry
# it. Live-verified on beta.12 (docs/ingestion-design.md §5.2) with a scratch
# NATS+RustFS pair: clean boot, full object round trip, survived a restart.
# ============================================================================
rustfs:
  image: rustfs/rustfs:1.0.0-beta.12
  replicaCount: 1
  apiPort: 9000
  consolePort: 9001

  # One identity, and it is an administrative one: creating a workspace's
  # bucket and its per-workspace user needs admin rights, and nothing else in
  # the system uses these. Every read and write of documents happens as a
  # workspace's own identity, from workspaces/values.yaml.
  #
  # Empty here on purpose — supply it in workspaces/values.yaml. The templates
  # require it, so a deploy without that file fails loudly rather than falling
  # back to a default password.
  #
  # There used to be three identities: this one plus a global `pa-uploader`
  # and `pa-worker` pair, whose policies enforced the raw/-vs-extracted/ write
  # split on a single shared bucket. Per-workspace isolation replaced both —
  # each workspace has its own bucket and identity, and the write split is
  # enforced by Vault.role in application code (workspace-isolation.md §9).
  # Neither key was referenced by any Go code; they and the setup Job that
  # created them were deleted (ingestion-design.md deviation 19).
  credentials:
    rootUser: ""
    rootPassword: ""
    # The identity every document read and write uses. Its access key is the
    # workspace.name constant; only the secret varies per install.
    secretKey: ""

  # Bucket notifications. There is no enable flag: the target's identity is
  # written by `--create-workspace` into an optional Secret, so "configured"
  # and "enabled" are the same fact (§5.2). Only the shape lives here.
  notify:
    subject: rustfs.events.raw
    jetstreamStreamName: RUSTFS_EVENTS
    # Default (/opt/rustfs/events) is unwritable by RustFS's non-root user —
    # identical bug class already fixed for the webhook target (§12 bug 1).
    queueDir: /data/.rustfs-events-notify

  persistence:
    enabled: true
    # CHANGING THIS ON A LIVE RELEASE REQUIRES RECREATING THE STATEFULSET.
    # volumeClaimTemplates is immutable, so `helm upgrade` fails with
    # "updates to statefulset spec ... are forbidden". See the chart README.
    #
    # Measured corpus 2026-07-27: 559Mi raw + ~280Mi extracted children.
    # ~60x headroom: the matter is active, and re-ingestion writes new
    # extracted/ objects without reclaiming old ones (§6.4).
    size: 50Gi
  resources:
    requests: {cpu: "200m", memory: "256Mi"}
    limits:   {cpu: "500m", memory: "768Mi"}

# ============================================================================
# Pipeline Bus: NATS JetStream
# ============================================================================
nats:
  # Empty here; supplied per install in workspaces/values-<id>.yaml.
  credentials:
    password: ""

  # RUSTFS_EVENTS' duplicate window. Must exceed RustFS's retry lifetime —
  # live-verified against beta.12, which refused to publish into a stream
  # carrying the 2-minute default. 10m leaves headroom (§5.2).
  rustfsEventsDedupWindow: 10m
  image: nats:2.14.3-alpine
  replicaCount: 1
  clientPort: 4222
  monitorPort: 8222
  persistence:
    enabled: true
    # Commands carry object references and doc_ids (~1Ki each), never document
    # text (§4.1). Sized for backlog depth, not document volume.
    size: 5Gi
  resources:
    requests: {cpu: "150m", memory: "128Mi"}
    limits:   {cpu: "300m", memory: "384Mi"}

# ============================================================================
# Tier 2 & 3: PostgreSQL + pgvector
# ============================================================================
postgres:
  # Managed by the CloudNativePG operator, one Cluster per workspace. The
  # operator is a cluster-wide prerequisite, not part of this chart:
  # `make deploy-operator`.
  #
  # The image is CNPG's own Postgres 18 build, which already carries pgvector —
  # so there is no separate pgvector image to keep in step with the server
  # version. A major-version bump still means new volumes: the on-disk format
  # changes, and the operator will not rewrite it in place.
  image: ghcr.io/cloudnative-pg/postgresql:18-standard-trixie

  # One instance per cluster. See the comment in templates/postgres.yaml.
  instances: 1
  port: 5432

  # The owner of every workspace database. One name across all of them, because
  # each workspace has its own cluster now — there is nothing to separate
  # *within* one, so per-workspace roles bought nothing. Passwords still
  # differ, one per workspace, from workspaces/values.yaml.
  appUser: app_user
  # Empty here; supplied per install in workspaces/values-<id>.yaml.
  credentials:
    password: ""

  # The database inside every cluster. One name everywhere, because the cluster
  # is already per-workspace — see templates/postgres.yaml.

  storage:
    # Per workspace, not shared. Steady state for the measured corpus is
    # ~250Mi; the headroom is for transient operations rather than growth — a
    # re-embed holds two embed_model namespaces at once, REINDEX needs ~2x the
    # index, and max_wal_size defaults to 1Gi regardless of corpus size (§6.4).
    size: 20Gi

  # Per cluster, so this multiplies by the number of workspaces.
  resources:
    requests: {cpu: "200m", memory: "384Mi"}
    limits:   {cpu: "1000m", memory: "1Gi"}

# ============================================================================
# Workspace identity
#
# There is no list. One release per workspace, one namespace per workspace —
# `make deploy-infra WORKSPACE=<id>` installs this chart into namespace <id>
# with workspaces/values-<id>.yaml. The workspace this release serves is the
# namespace it is in, so the chart never needs to be told an id.
#
# That is also why every resource name below is a constant: the bucket, the
# NATS account and the Postgres database are all `workspace`. Naming them after
# the workspace would repeat, in three places, what the namespace already says.
#
# Only credentials vary between installs, and they live in
# workspaces/values-<id>.yaml — empty here, and `required` in the templates, so
# a deploy without that file fails loudly rather than falling back to a
# published default.
# ============================================================================
workspace:
  # The bucket, NATS account and Postgres database name. One value, because
  # they are deliberately identical.
  name: workspace

# ============================================================================
# Operators
#
# Each can be disabled where a cluster already runs one — CloudNativePG in
# particular is commonly installed cluster-wide for other workloads, and a
# second copy would leave two controllers reconciling the same CRDs.
# ============================================================================
cloudnative-pg:
  enabled: true
  # Named for the chart, not the release. These are shared operators, not part
  # of pocket-advisor: prefixing them implies this release owns something it
  # merely installs, and a second release would produce a second differently
  # prefixed copy of the same controller.
  fullnameOverride: cloudnative-pg

nack:
  enabled: true
  # NACK defaults useLegacyNames: true, which names its Deployment after the
  # *release* alone — so it appeared as a bare "pocket-advisor", indistinguishable
  # from anything of ours. false switches it to the chart name.
  useLegacyNames: false
  nameOverride: nack
  jetstream:
    enabled: true
    # No default server URL: every Stream names its own, because each
    # authenticates as its own workspace's NATS account.

rustfs-operator:
  enabled: true
  fullnameOverride: rustfs-operator
  # A web UI we never open; the operator itself is what reconciles Tenants.
  console:
    enabled: false
