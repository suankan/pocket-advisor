{{/*
nats-server.conf, including one account per workspace, rendered from
.Values.workspaces (supplied by workspaces/values.yaml at deploy time).

Helm owns this file outright. It used to render an empty accounts block with
BEGIN/END markers that --create-workspace patched in place, which meant two
writers on one ConfigMap field: Helm via server-side apply, provisioning via
Update. Every `helm upgrade` then failed with a field-ownership conflict on
.data.nats-server.conf, and the documented recovery — force-applying Helm's
version — silently discarded every workspace account, leaving a running
cluster whose workspaces could not authenticate. Rendering them here removes
the second writer, and with it the 25-56s wait --create-workspace spent
watching kubelet propagate the patched file into the pod
(ingestion-design.md deviation 18).

The cost is that adding a workspace now needs a `helm upgrade`, which
`make deploy-infra` does.

This is authentication, not an upgrade of it: before this file existed, NATS
ran on bare CLI flags with no config, no accounts, no users — anyone who
could reach the ClusterIP had full access to everything.
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-nats-config
  labels:
    {{- include "pa.labels" (dict "ctx" . "component" "message-bus") | nindent 4 }}
  {{- with include "pa.annotations" (dict "ctx" . "description" "NATS server config; per-workspace account blocks are appended by --create-workspace") }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
data:
  nats-server.conf: |
    port: {{ .Values.nats.clientPort }}
    http: {{ .Values.nats.monitorPort }}

    jetstream {
      store_dir: /data
    }

    # One account per workspace, each with its own JetStream store and its own
    # user (workspace-isolation.md §2.3, §8). Empty until workspaces/values.yaml
    # supplies a list — a NATS server with an empty accounts block still starts,
    # it simply has nothing but the global account.
    accounts {
    {{- range .Values.workspaces }}
      {{ .nats.account | default .id | quote }}: {
        jetstream: enabled
        users: [
          { user: {{ .nats.credentials.user | default .id | quote }}, password: {{ required (printf "workspaces[%s].nats.credentials.password is required" .id) .nats.credentials.password | quote }} }
        ]
      }
    {{- end }}
    }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-nats
  labels:
    {{- include "pa.labels" (dict "ctx" . "component" "message-bus") | nindent 4 }}
  {{- with include "pa.annotations" (dict "ctx" . "description" "NATS JetStream — the queues between pipeline worker pools") }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
spec:
  serviceName: {{ .Release.Name }}-nats
  replicas: {{ .Values.nats.replicaCount }}
  selector:
    matchLabels:
      app: nats
  template:
    metadata:
      labels:
        app: nats
    spec:
      containers:
        - name: nats
          image: {{ .Values.nats.image }}
          command:
            - nats-server
            - "-c"
            - "/etc/nats/nats-server.conf"
          ports:
            - containerPort: {{ .Values.nats.clientPort }}
            - containerPort: {{ .Values.nats.monitorPort }}
          resources:
            {{- toYaml .Values.nats.resources | nindent 12 }}
          volumeMounts:
            - name: nats-data
              mountPath: /data
            - name: nats-config
              mountPath: /etc/nats
              readOnly: true
      volumes:
        - name: nats-config
          configMap:
            name: {{ .Release.Name }}-nats-config
  volumeClaimTemplates:
    - metadata:
        name: nats-data
      spec:
        accessModes: [ "ReadWriteOnce" ]
        resources:
          requests:
            storage: {{ .Values.nats.persistence.size }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-nats
  labels:
    {{- include "pa.labels" (dict "ctx" . "component" "message-bus") | nindent 4 }}
  {{- with include "pa.annotations" (dict "ctx" . "description" "Cluster-internal endpoint for the NATS client and monitoring ports") }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.nats.clientPort }}
      targetPort: {{ .Values.nats.clientPort }}
      name: client
    - port: {{ .Values.nats.monitorPort }}
      targetPort: {{ .Values.nats.monitorPort }}
      name: monitor
  selector:
    app: nats
