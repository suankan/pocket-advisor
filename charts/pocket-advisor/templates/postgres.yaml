apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-postgres
  labels:
    {{- include "pa.labels" (dict "ctx" . "component" "database") | nindent 4 }}
  {{- with include "pa.annotations" (dict "ctx" . "description" "PostgreSQL with pgvector — Tier 2 lineage and Tier 3 vectors") }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
spec:
  serviceName: {{ .Release.Name }}-postgres
  replicas: {{ .Values.postgres.replicaCount }}
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          ports:
            - containerPort: {{ .Values.postgres.port }}
          env:
            # No POSTGRES_DB: every workspace gets its own database
            # (--create-workspace, workspace-isolation.md §6) and admin
            # operations use Postgres's own built-in `postgres` maintenance
            # database (infra.postgres.admin_dsn) — nothing needs a
            # dedicated bootstrap database created here.
            # From the Secret rather than inlined from values: the Secret
            # already carries them, and this keeps the password out of the
            # StatefulSet spec that `kubectl get sts -o yaml` prints.
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-credentials
                  key: postgres-user
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-credentials
                  key: postgres-password
          resources:
            {{- toYaml .Values.postgres.resources | nindent 12 }}
          volumeMounts:
            # Postgres 18's image restructured its volume layout to support
            # pg_upgrade: PGDATA now lives in a version-named subdirectory
            # under this mount rather than at its root (docker-library/
            # postgres#1259). Mounting directly at .../data, as pg16 wanted,
            # makes every pg18+ container refuse to start.
            - name: postgres-data
              mountPath: /var/lib/postgresql
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes: [ "ReadWriteOnce" ]
        resources:
          requests:
            storage: {{ .Values.postgres.persistence.size }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-postgres
  labels:
    {{- include "pa.labels" (dict "ctx" . "component" "database") | nindent 4 }}
  {{- with include "pa.annotations" (dict "ctx" . "description" "Cluster-internal endpoint for PostgreSQL") }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.postgres.port }}
      targetPort: {{ .Values.postgres.port }}
      name: postgres
  selector:
    app: postgres
