apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-rustfs
  labels:
    {{- include "pa.labels" (dict "ctx" . "component" "object-store") | nindent 4 }}
  {{- with include "pa.annotations" (dict "ctx" . "description" "RustFS object store — Tier 1, the corpus source of truth") }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
spec:
  serviceName: {{ .Release.Name }}-rustfs
  replicas: {{ .Values.rustfs.replicaCount }}
  selector:
    matchLabels:
      app: rustfs
  template:
    metadata:
      labels:
        app: rustfs
    spec:
      containers:
        - name: rustfs
          image: {{ .Values.rustfs.image }}
          ports:
            - containerPort: {{ .Values.rustfs.apiPort }}
            - containerPort: {{ .Values.rustfs.consolePort }}
          env:
            - name: RUSTFS_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-credentials
                  key: rustfs-root-user
            - name: RUSTFS_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-credentials
                  key: rustfs-root-password
            # Bucket notifications are always declared, never gated. Their
            # values come from an OPTIONAL Secret that `--create-workspace`
            # writes, which gives two properties the old `enabled` flag could
            # not: `helm upgrade` cannot revert the target, because the chart
            # never held its values; and a fresh install simply has no Secret,
            # so the variables are unset and notification is off until the
            # first workspace is provisioned (§5.2).
            #
            # Three deployment fixes are baked in here, all found by live
            # testing against beta.12 and none of them code changes:
            #   1. RUSTFS_NOTIFY_ENABLE is a separate top-level module gate;
            #      without it no target is constructed at all, silently.
            #   2. The default queue dir (/opt/rustfs/events) is unwritable by
            #      RustFS's non-root user (§12 bug 1, same class as the old
            #      webhook target).
            #   3. The target stream's duplicate window must exceed RustFS's
            #      retry lifetime (~274s observed) or it refuses to publish —
            #      internal/bus.go creates RUSTFS_EVENTS with 10m to match.
            - name: RUSTFS_NOTIFY_ENABLE
              value: "true"
            - name: RUSTFS_NOTIFY_NATS_ENABLE_PRIMARY
              value: "on"
            - name: RUSTFS_NOTIFY_NATS_ADDRESS_PRIMARY
              value: {{ printf "%s-nats:4222" .Release.Name | quote }}
            - name: RUSTFS_NOTIFY_NATS_SUBJECT_PRIMARY
              value: {{ .Values.rustfs.notify.subject | quote }}
            - name: RUSTFS_NOTIFY_NATS_JETSTREAM_ENABLE_PRIMARY
              value: "on"
            - name: RUSTFS_NOTIFY_NATS_JETSTREAM_STREAM_NAME_PRIMARY
              value: {{ .Values.rustfs.notify.jetstreamStreamName | quote }}
            - name: RUSTFS_NOTIFY_NATS_QUEUE_DIR_PRIMARY
              value: {{ .Values.rustfs.notify.queueDir | quote }}
            # The workspace identity. Optional: absent until provisioning
            # writes it, which is what keeps a fresh install quiet.
            - name: RUSTFS_NOTIFY_NATS_USERNAME_PRIMARY
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-rustfs-notify
                  key: workspace-id
                  optional: true
            - name: RUSTFS_NOTIFY_NATS_PASSWORD_PRIMARY
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-rustfs-notify
                  key: nats-password
                  optional: true
          # Without this the pod reports Ready the moment the process starts,
          # roughly four seconds in, while RustFS is still bringing storage up
          # — its own log says "storage layer not initialized" at that point.
          # Everything that waits on Ready was therefore waiting on nothing:
          # `helm upgrade --wait`, `kubectl rollout status`, and provisioning's
          # own post-restart wait all returned early, pushing the real delay
          # into a retry loop against a server that could not answer yet
          # (§5.2, deviation 15).
          #
          # /minio/health/live is RustFS's own liveness endpoint, unauthenticated
          # and served only once the object layer is up, which is exactly the
          # condition callers care about.
          readinessProbe:
            httpGet:
              path: /minio/health/live
              port: {{ .Values.rustfs.apiPort }}
            initialDelaySeconds: 2
            periodSeconds: 2
            timeoutSeconds: 3
            failureThreshold: 30
          # Deliberately more forgiving than readiness: readiness gates traffic,
          # liveness kills the container. A slow start must not become a restart
          # loop, so this only fires well past any plausible boot.
          livenessProbe:
            httpGet:
              path: /minio/health/live
              port: {{ .Values.rustfs.apiPort }}
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            {{- toYaml .Values.rustfs.resources | nindent 12 }}
          volumeMounts:
            - name: rustfs-data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: rustfs-data
      spec:
        accessModes: [ "ReadWriteOnce" ]
        resources:
          requests:
            storage: {{ .Values.rustfs.persistence.size }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-rustfs
  labels:
    {{- include "pa.labels" (dict "ctx" . "component" "object-store") | nindent 4 }}
  {{- with include "pa.annotations" (dict "ctx" . "description" "Cluster-internal endpoint for the RustFS S3 and console ports") }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.rustfs.apiPort }}
      targetPort: {{ .Values.rustfs.apiPort }}
      name: api
    - port: {{ .Values.rustfs.consolePort }}
      targetPort: {{ .Values.rustfs.consolePort }}
      name: console
  selector:
    app: rustfs
