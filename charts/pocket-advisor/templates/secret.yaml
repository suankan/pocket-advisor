apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-credentials
  labels:
    {{- /* No component: these credentials span all three stores, and
           app.kubernetes.io/component marks the role of one piece. */}}
    {{- include "pa.labels" (dict "ctx" .) | nindent 4 }}
  {{- with include "pa.annotations" (dict "ctx" . "description" "Administrative credentials for RustFS and PostgreSQL, supplied by workspaces/values.yaml") }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
type: Opaque
stringData:
  # Administrative only. Creating a workspace's database/role and its
  # bucket/identity needs these; every read and write of documents afterwards
  # happens as that workspace's own identity, from workspaces/values.yaml.
  #
  # `required` rather than a default: this chart is committed, so a default
  # here would be a published password that a deploy could silently fall back
  # to. Failing the render is the point.
  rustfs-root-user: {{ required "rustfs.credentials.rootUser is required — set it in workspaces/values.yaml" .Values.rustfs.credentials.rootUser | quote }}
  rustfs-root-password: {{ required "rustfs.credentials.rootPassword is required — set it in workspaces/values.yaml" .Values.rustfs.credentials.rootPassword | quote }}

  postgres-user: {{ required "postgres.credentials.user is required — set it in workspaces/values.yaml" .Values.postgres.credentials.user | quote }}
  postgres-password: {{ required "postgres.credentials.password is required — set it in workspaces/values.yaml" .Values.postgres.credentials.password | quote }}
