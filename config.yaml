# Platform-layer configuration — no user/workspace/case content. Committed
# with the repo. `internal/config` loads only the `infra:` section below;
# every key in it is optional and falls back to a built-in default.
#
# Precedence: built-in defaults < this file < environment variables < flags.
# Put secrets in the environment rather than here; the file is committed.

# ============================================================================
# Infrastructure endpoints
#
# pocket-advisor runs on the host; its three stores stay in the local OrbStack
# cluster. These defaults match a `pocket-advisor` Helm release in the
# a namespace per workspace, so a stock local cluster needs no edits here —
# this section exists to point at a different one.
# ============================================================================
infra:
  rustfs:
    # OrbStack routes *.svc.cluster.local from macOS via the system resolver.
    endpoint: rustfs-io.%s.svc.cluster.local:9000
    use_ssl: false

  nats:
    url: nats://nats.pocket-advisor.svc.cluster.local:4222

  postgres:
    # There is no admin connection. CloudNativePG gives each workspace its own
    # cluster, so nothing creates a database or a role — the chart declares a
    # Cluster CRD per workspace and the operator reconciles it.
    #
    # A workspace's address is this template plus its id: the operator exposes
    # each cluster's primary as <cluster>-rw, and the chart names the cluster
    # <release>-<workspace-id>.
    host_template: postgres-rw.%s.svc.cluster.local
    port: 5432
    # `require`, not `verify-full`: CNPG issues its own internal CA, so
    # verifying the chain would mean shipping that CA to the host for no gain
    # on a local cluster. Connections are still encrypted.
    sslmode: require
    max_conns: 50

  embedding:
    # Plain localhost: the process calling this now runs on the machine serving
    # it, so the host.docker.internal hop the in-cluster workers needed is gone.
    endpoint: http://localhost:8000/v1/embeddings
    model: jina-embeddings-v5-text-small-mlx
    # The one concurrency knob in the system. Every other pool is sized from
    # runtime.NumCPU(), because the host is the honest authority on how much
    # work fits at once — but this limit lives in the endpoint, not here.
    concurrency: 8
    timeout: 60s

  # Read path (retrieval-design.md §8). Only where the models live is a
  # setting — which model is fixed in code, because every latency and quality
  # figure in that design was measured against a specific pair, and both slots
  # degrade silently rather than erroring when filled wrongly.
  reranking:
    endpoint: http://localhost:8000/v1/rerank
    timeout: 60s

  # Query preparation only — decomposition. Never answer generation, which
  # happens outside this codebase over MCP (§6.1). Thinking must be disabled
  # on this model server-side: with it on, the call takes 5x as long and
  # returns chain-of-thought instead of queries.
  llm:
    endpoint: http://localhost:8000/v1/chat/completions
    timeout: 30s

  observability:
    metrics_port: 9090
    log_level: info
    # One file per role. The terminal belongs to the live dashboard, so these
    # files are the complete record of what each role did.
    log_dir: logs

# ============================================================================
# Workspace registry (workspace-isolation.md)
#
# A workspace is described by two gitignored files, joined on id: one for what
# it holds (collections, paths, bank details) and one for how to reach it
# (credentials). Neither lives here — this file stays committed and
# secret-free, matching the header above.
#
# Both paths below are resolved relative to THIS FILE, not to the working
# directory of whatever ran the binary. That is what lets `--config <abs path>`
# be enough on its own for an MCP client, which launches the server from a
# directory of its own choosing. An absolute path here is left as written.
# ============================================================================
workspaces:
  # What each workspace holds: its collections and where they live on disk.
  config: workspaces/workspace-config.yaml
  # Its infrastructure credentials — and only credentials; every resource name
  # inside a workspace's namespace is a constant. One file for every workspace,
  # the same one `make deploy-infra` passes to helm with -f, so the chart and
  # this binary cannot disagree about a password. Gitignored; the shape is
  # documented in charts/pocket-advisor-infra/values.yaml.
  values: workspaces/pocket-advisor-infra.yaml
