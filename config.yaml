# Platform-layer configuration — no user/workspace/case content. Committed
# with the repo. `internal/config` loads only the `infra:` section below.
#
# This file is the only source of truth for the values marked REQUIRED
# below — there is no Go-side default for any of them any more (deviation
# 41 removed the last ones: they used to silently fall back to this exact
# file's own committed values, which meant a real config.yaml was never
# actually necessary and a typo here could go unnoticed if it happened to
# match the Go default anyway). Everything else keeps a built-in default
# and stays genuinely optional.
#
# Precedence: built-in defaults < this file < environment variables < flags.
# Put secrets in the environment rather than here; the file is committed.

# ============================================================================
# Infrastructure endpoints
#
# pocket-advisor runs on the host; its three stores stay in the local OrbStack
# cluster. These values match a `pocket-advisor` Helm release in the
# pocket-advisor namespace, so a stock local cluster needs no edits here —
# this section exists to point at a different one. `./pocket-advisor.sh`
# reads rustfs/nats/postgres below too (deploy-workspace/destroy-workspace),
# so this file is the one place either has to agree on a host or a port.
# ============================================================================
infra:
  rustfs:
    # REQUIRED. OrbStack routes *.svc.cluster.local from macOS via the
    # system resolver. Not templated by workspace: one shared RustFS
    # StatefulSet (deviation 39), so its address is as constant as
    # nats.url's below.
    endpoint: rustfs.pocket-advisor.svc.cluster.local:9000
    use_ssl: false
    # No admin credential here, deliberately — see postgres.host's comment
    # below for the same reasoning. RustFS's root identity is the fixed
    # literal admin/admin (charts/pocket-advisor-infra/values.yaml), used
    # only by ./pocket-advisor.sh deploy-workspace/destroy-workspace;
    # internal/config has no field for it and never will (deviation 39). The
    # application itself never authenticates to RustFS at all — a
    # workspace's bucket carries a public policy scoped to itself.

  nats:
    # REQUIRED.
    url: nats://nats.pocket-advisor.svc.cluster.local:4222

  postgres:
    # host is REQUIRED. There is no admin connection this binary holds —
    # ./pocket-advisor.sh deploy-workspace holds the one that exists, and
    # only at the shell, never in this file or in Go (deviation 39: no
    # CloudNativePG, no Database/DatabaseRole CRD, a plain StatefulSet and
    # psql instead).
    #
    # Not templated by workspace, unlike rustfs.endpoint above: there is only
    # one Postgres, in the release namespace, so its address is as constant
    # as nats.url's. A workspace's own database and role names carry the id
    # instead (<id>, <id>_user).
    host: postgres.pocket-advisor.svc.cluster.local
    port: 5432
    # `disable`, not `require`. CloudNativePG issued its own internal CA for
    # free; the plain StatefulSet that replaced it (deviation 39) offers no
    # TLS at all — no cert, no key — so `require` would refuse every
    # connection outright. Revisit only if this stops being a local,
    # single-user cluster.
    sslmode: disable
    max_conns: 50

  embedding:
    # endpoint is effectively REQUIRED — RequireEmbedding checks it lazily,
    # only for the modes that actually need it (ingest, listen), rather than
    # unconditionally here. Plain localhost: the process calling this now
    # runs on the machine serving it, so the host.docker.internal hop the
    # in-cluster workers needed is gone.
    endpoint: http://localhost:8000/v1/embeddings
    model: jina-embeddings-v5-text-small-mlx
    # The one concurrency knob in the system. Every other pool is sized from
    # runtime.NumCPU(), because the host is the honest authority on how much
    # work fits at once — but this limit lives in the endpoint, not here.
    concurrency: 8
    timeout: 60s

  # Read path (retrieval-design.md §8). endpoint and model are both
  # REQUIRED — unlike embedding.model above, changing this one is not a
  # casual choice: every latency and quality figure in that design was
  # measured against this specific model, and this slot degrades silently
  # (reorders badly) rather than erroring when filled with the wrong one.
  # Fixed by convention now, not by the type system — deviation 41 moved it
  # here from a Go constant nothing could override; nothing stops it being
  # edited, only this comment argues against doing so lightly.
  reranking:
    endpoint: http://localhost:8000/v1/rerank
    model: jina-reranker-v3-mlx
    timeout: 60s

  # Query preparation and explicitly invoked bounded topic mention extraction.
  # Never answer generation, which happens outside this codebase over MCP (§6.1).
  # endpoint and model are
  # both REQUIRED, for the same reason as reranking.model above: this
  # design's numbers were measured against this one model, and a reasoning
  # model in this slot returns chain-of-thought where queries were expected
  # rather than erroring. Thinking must be disabled on this model
  # server-side regardless: with it on, the call takes 5x as long.
  llm:
    endpoint: http://localhost:8000/v1/chat/completions
    model: Qwen3.5-4B-MLX-4bit
    timeout: 30s

  # Bounded, local extraction of source-backed email topic mentions. Change
  # the opaque versions before changing a bound, the prompt, or the model.
  # A build is then isolated in a replacement graph version until promotion.
  topic_graph:
    extraction_version: topic-mentions-v1
    config_version: topic-mentions-config-v1
    prompt_version: topic-mentions-prompt-v1
    max_input_bytes: 262144
    max_output_bytes: 65536
    max_output_tokens: 1024
    max_mentions_per_doc: 64
    max_spans_per_mention: 8
    max_display_label_bytes: 256
    # Relation classification runs only in the explicit topic graph build after
    # source-backed mentions are persisted. Its candidates are exact email
    # references, never subject or embedding similarity.
    relation_version: topic-relations-v1
    relation_prompt_version: topic-relations-prompt-v1
    relation_max_input_bytes: 524288
    relation_max_output_bytes: 65536
    relation_max_output_tokens: 1024
    relation_max_candidates: 512
    relation_min_confidence: 0.80

  observability:
    metrics_port: 9090
    log_level: info
    # One file per role. The terminal belongs to the live dashboard, so these
    # files are the complete record of what each role did.
    log_dir: logs

# ============================================================================
# Workspace registry (workspace-isolation.md)
#
# A workspace is described by one gitignored file: what it holds (collections,
# paths, bank details). There is no separate credentials file any more —
# every workspace's Postgres role, RustFS bucket, and NATS subjects/streams
# are simply its own id, or derived from it by fixed convention (this is a
# fully local, single-operator system), computed wherever needed rather than
# stored anywhere.
#
# The path below is resolved relative to THIS FILE, not to the working
# directory of whatever ran the binary. That is what lets `--config <abs path>`
# be enough on its own for an MCP client, which launches the server from a
# directory of its own choosing. An absolute path here is left as written.
# ============================================================================
workspaces:
  # REQUIRED. What each workspace holds: its collections and where they live
  # on disk.
  config: workspaces/workspace-config.yaml

# ============================================================================
# MCP Server Configuration
#
# The MCP server runs locally on the host, not in Kubernetes.
# Configuration here is used by both stdio and HTTP transports.
# ============================================================================
mcp:
  http:
    # Local listen address for the MCP HTTP server.
    addr: "127.0.0.1:8080"
    # HTTP endpoint path (must start with /)
    endpoint: "/mcp"
    # The public MCP URL. Only actually required (and validated as HTTPS)
    # once oauth.google_client_id below is set, but harmless to leave set
    # otherwise. https://127.0.0.1:8080/mcp matches this server's own
    # loopback address and the self-signed cert below, so the client dials
    # 127.0.0.1 directly — no reverse proxy or DNS name needed.
    resource_uri: "https://127.0.0.1:8080/mcp"
    # Maximum concurrent in-flight requests
    max_concurrent: 8

  # Google OAuth settings (optional - only needed for authenticated HTTP
  # mode). Leave both fields below empty to run without authentication.
  # Google is the sole supported identity provider; no client secret is
  # needed here, since ID-token verification is a public-key operation.
  oauth:
    # OAuth 2.0 Client ID registered in Google Cloud Console for this MCP
    # server's client (the audience every ID token is checked against).
    google_client_id: ""
    # Google account emails allowed to authenticate. Required and must be
    # non-empty whenever google_client_id is set.
    allowed_emails: []

  # TLS: self-signed cert for 127.0.0.1, gitignored under workspaces/. The
  # server always serves real HTTPS on loopback this way, authenticated or
  # not. Regenerate if missing or expired:
  #   mkdir -p workspaces/mcp-tls
  #   openssl req -x509 -newkey rsa:2048 -nodes -days 365 \
  #     -keyout workspaces/mcp-tls/key.pem -out workspaces/mcp-tls/cert.pem \
  #     -subj "/CN=127.0.0.1" -addext "subjectAltName=IP:127.0.0.1"
  tls:
    cert_file: "workspaces/mcp-tls/cert.pem"
    key_file: "workspaces/mcp-tls/key.pem"
