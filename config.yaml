# Platform-layer configuration — no user/workspace/case content. Committed
# with the repo. `internal/config` loads only the `infra:` section below;
# every key in it is optional and falls back to a built-in default.
#
# Precedence: built-in defaults < this file < environment variables < flags.
# Put secrets in the environment rather than here; the file is committed.

# ============================================================================
# Infrastructure endpoints
#
# pocket-advisor runs on the host; its three stores stay in the local OrbStack
# cluster. These defaults match a `pocket-advisor` Helm release in the
# `pocket-advisor` namespace, so a stock local cluster needs no edits here —
# this section exists to point at a different one.
# ============================================================================
infra:
  rustfs:
    # OrbStack routes *.svc.cluster.local from macOS via the system resolver.
    endpoint: pocket-advisor-rustfs.pocket-advisor.svc.cluster.local:9000
    use_ssl: false
    # No root credentials here. They live in workspaces/values.yaml — the same
    # file Helm is given — so the cluster and this binary share one definition
    # rather than two that can drift, and this committed file stays
    # secret-free. Used only by --create-workspace/--delete-workspace, to
    # create or drop a workspace's own bucket and identity
    # (workspace-isolation.md §3, §6); never to read or write documents.

  nats:
    url: nats://pocket-advisor-nats.pocket-advisor.svc.cluster.local:4222

  postgres:
    # The maintenance connection --create-workspace/--delete-workspace use to
    # CREATE/DROP per-workspace databases and roles (workspace-isolation.md
    # §3, §6). Never used for document data.
    # Deliberately carries no user or password: those are injected from
    # workspaces/values.yaml at load time, keeping this committed file
    # secret-free.
    admin_dsn: postgres://pocket-advisor-postgres.pocket-advisor.svc.cluster.local:5432/postgres?sslmode=disable
    # Must cover every lane that can hold a connection at once. pgxpool
    # defaults to max(4, NumCPU), which becomes the pipeline's narrowest point
    # once all roles share one process.
    max_conns: 50

  kubernetes:
    # What --create-workspace/--delete-workspace need to reach the cluster's
    # own API for the NATS account provisioning step (workspace-isolation.md
    # §8) — nothing else in pocket-advisor talks to the Kubernetes API.
    # Uses the operator's own ambient kubeconfig, the same context kubectl/helm
    # already use; no separate credential lives here.
    namespace: pocket-advisor
    nats_statefulset: pocket-advisor-nats
    nats_configmap: pocket-advisor-nats-config

  embedding:
    # Plain localhost: the process calling this now runs on the machine serving
    # it, so the host.docker.internal hop the in-cluster workers needed is gone.
    endpoint: http://localhost:8000/v1/embeddings
    model: jina-embeddings-v5-text-small-mlx
    # The one concurrency knob in the system. Every other pool is sized from
    # runtime.NumCPU(), because the host is the honest authority on how much
    # work fits at once — but this limit lives in the endpoint, not here.
    concurrency: 16
    timeout: 60s

  # Read path (retrieval-design.md §8). Only where the models live is a
  # setting — which model is fixed in code, because every latency and quality
  # figure in that design was measured against a specific pair, and both slots
  # degrade silently rather than erroring when filled wrongly.
  reranking:
    endpoint: http://localhost:8000/v1/rerank
    timeout: 60s

  # Query preparation only — decomposition. Never answer generation, which
  # happens outside this codebase over MCP (§6.1). Thinking must be disabled
  # on this model server-side: with it on, the call takes 5x as long and
  # returns chain-of-thought instead of queries.
  llm:
    endpoint: http://localhost:8000/v1/chat/completions
    timeout: 30s

  observability:
    metrics_port: 9090
    log_level: info
    # One file per role. The terminal belongs to the live dashboard, so these
    # files are the complete record of what each role did.
    log_dir: logs

# ============================================================================
# Workspace registry (workspace-isolation.md)
#
# A workspace is described by two gitignored files, joined on id: one for what
# it holds (collections, paths, bank details) and one for how to reach it
# (database, bucket and NATS names plus credentials). Neither lives here —
# this file stays committed and secret-free, matching the header above.
# ============================================================================
workspaces:
  # What each workspace holds: its collections and where they live on disk.
  config: workspaces/workspace-config.yaml
  # Its infrastructure: database, bucket and NATS names plus credentials.
  # The same file `make deploy-infra` passes to helm with -f, so the chart
  # and this binary cannot disagree about a password. Gitignored; see
  # workspaces/values.yaml.example.
  values: workspaces/values.yaml
