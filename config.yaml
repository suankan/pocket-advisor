# Platform-layer configuration — no user/workspace/case content
# (`docs_old/DESIGN.md` tenet 10). Committed with the repo. Every key is
# optional; omitted keys fall back to scripts/config.py. Unknown keys
# abort loudly (typo protection).
#
# Three-class knob discipline (`docs_old/DESIGN.md`):
#   - query / ingestion.ocr / ingestion.thread_* / ingestion.doc_date_* /
#     ingestion.embed_text: FREE, change anytime.
#   - ingestion.chunking / models.mlx_model_embed_text: INDEX-INVALIDATING.
#     Model changes select a separate cache on the next
#     `pocket-advisor.py ingest --embed text` (or `--embed all`).
#     Chunking only WARNs — no
#     automated re-chunk pipeline (`docs_old/specs/config-yaml.md`).
#   - Privilege is NOT configured here: collections[].privileged in
#     workspaces/workspace-config.yaml and/or a path segment literally
#     named privileged/ (AGENTS.md hard rule 2).

workspaces:
  # Parent directory for all matters (relative to repo root). Active
  # workspace + evidence collections are declared in the gitignored user
  # registry: {dir}/workspace-config.yaml
  # See docs_old/specs/workspace-config-v2.md and its example YAML.
  dir: workspaces

# Optional legacy (ignored when workspace-config.yaml is present):
# workspace:
#   dir: workspaces/my-matter

query:
  # How many candidates the BM25/FTS5 keyword-search leg pulls before
  # fusion. Higher = more lexical recall considered, more CPU/latency.
  fts_candidates: 50
  # How many candidates the dense vector/embedding-search leg pulls
  # before fusion. Higher = more semantic recall considered.
  vec_candidates: 50
  # Reciprocal Rank Fusion constant: combined_score = sum(1/(rrf_k +
  # rank + 1)) across the FTS and vector rankings. Higher flattens the
  # weighting given to top-ranked vs lower-ranked candidates within
  # each leg; lower makes top ranks dominate more strongly.
  rrf_k: 60
  # Number of results query.py returns by default (overridable per
  # call with --top-k).
  default_top_k: 15
  # Whether the cross-encoder reranker re-scores the fused RRF
  # candidate list before the top-k cut. See docs_old/specs/reranker.md
  # for the measured accuracy/latency tradeoff; false falls back to
  # plain RRF ordering.
  rerank_enabled: true
  # How many characters of each candidate's (whitespace-collapsed)
  # text are fed to the reranker. Reranker cost scales ~linearly with
  # this value (measured: ~140ms/candidate at ~1000 chars vs ~47ms at
  # 300 chars) — latency/thoroughness dial; see docs_old/specs/reranker.md.
  rerank_text_chars: 600
  # Session-warm query daemon (docs_old/specs/query-daemon.md): when
  # `query_daemon.py serve` is running, query.py sends searches over a
  # local Unix socket so embed/rerank weights stay loaded. FREE knobs.
  daemon_auto: true          # use daemon when socket is live
  daemon_idle_sec: 1800      # daemon exits after N idle seconds; 0=never
  # Include registry-privileged collections in retrieval by default.
  # Single-user: own-solicitor often holds opposing-counsel forwards.
  # Set false (or pass --exclude-privileged) for a restricted pass.
  include_privileged_by_default: true

ingestion:
  chunking:
    # Target chunk size in characters. Splitting prefers a paragraph
    # break, then any newline, within the last 40% of the target
    # length. INDEX-INVALIDATING for *new* chunks only — existing
    # chunks keep original size (no automated re-chunk); ingest /
    # query WARN when config no longer matches vectors.meta.json.
    chars: 1500
    # Overlap between adjacent chunks of the same source. Same
    # INDEX-INVALIDATING caveat as chars.
    overlap: 200
  ocr:
    # OCR language flags, e.g. "eng+rus" for a bilingual corpus.
    # Missing a language here makes OCR on that script fail silently
    # into plausible-looking garbage — no error, just wrong text.
    langs: eng+rus
    # Image attachments at or below this size (bytes) are treated as
    # signature/logo and skipped (not OCR'd / not indexed).
    small_image_bytes: 20000
  # Fallback threading when headers lack In-Reply-To/References:
  # same normalized subject + ≥1 shared participant within this window.
  thread_fallback_window_days: 60
  # Header/letterhead window (chars) for standalone document dates
  # before full-text / filename / mtime fallback.
  doc_date_header_window_chars: 6000
  # Whether stage `all` builds the text vector index. An explicit
  # `--embed text` forces the channel regardless of this flag.
  embed_text: true

models:
  # Apple-Silicon MLX only — no GGUF / llama.cpp.
  # INDEX-INVALIDATING: changing the text repo resolves to a different
  # per-model cache on next `ingest --embed text`
  # — never deletes another model's cache
  # (`docs_old/specs/multi-model-vector-cache.md`).
  # Reranker is not index-invalidating.
  # Requires: pip install -r scripts/requirements.txt (includes MLX).
  # Fetch once: venv/bin/python scripts/fetch_model.py
  #
  # Nano (smaller/faster) — code defaults in scripts/config.py:
  # mlx_model_embed_text: jinaai/jina-embeddings-v5-text-nano-mlx
  # Small (higher quality, larger):
  mlx_model_embed_text: jinaai/jina-embeddings-v5-text-small-mlx
  mlx_model_rerank: jinaai/jina-reranker-v3-mlx
