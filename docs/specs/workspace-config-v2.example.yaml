# Schema v2 registry example (committed reference).
# Full design: docs/specs/workspace-config-v2.md
# Live instance (gitignored): workspaces/workspace-config.yaml
#
# Core idea
# ---------
# Filesystem paths are agnostic of matter names. Evidence lives in a
# shared corpora tree. Workspaces are metadata + mount lists that
# regulate *visibility*: which collections the active matter may query.
# Share by reference only — never copy blobs between matters.
#
# ONE shared engine DB for all workspaces (locked):
# - All collections ingested once into a single content index.
# - Active workspace ⇒ mount filter (collection_id ∈ mounts).
# - Per-workspace folders: semi-inferred matter state only
#   (*.md, search-accuracy-test, journal) — not bulk evidence.
#
# On-disk layout (under platform workspaces.dir)
# ----------------------------------------------
#   workspaces/
#     workspace-config.yaml          # this schema (gitignored live copy)
#     corpora/<collection_id>/       # READ-ONLY facts
#     .state/                         # regenerable engine store
#       pocket_advisor.db, vectors/, logs/, query_daemon.sock
#       cache/<collection_id>/{extracted,text}/
#     <workspace_id>/                # matter: WORKSPACE.md, skills, search-accuracy-test…
#
# Facts vs state
# --------------
# - corpora/ = read-only facts. Never write/rename/delete evidence.
# - .state/ = regenerable. .state/cache/<collection_id>/ = engine-only.
# - workspaces/<id>/ = agent-readable semi-inferred matter state.
# - Query visibility = mounts ∩ privilege.
#
# Collection fields (minimal)
# ---------------------------
# - id, title, description, path, privileged
# - NO kind:    ingest dispatches per FILE by extension/MIME
#               (.eml → email pipeline; pdf/docx/… → document pipeline).
#               A collection may mix types.
# - NO retrieval: searchable text is derived by the engine from supported
#                 file types.
#
# Path rules
# ----------
# - collection.path / workspace.path : relative to workspaces.dir
# - roots non-overlapping; no `..` escape
#
# Privilege
# ---------
# - collections[].privileged (bool, required)
# - OR path segment literally named privileged/ under a collection root
# - privilege_override on items always wins
# - Platform config.yaml never carries privilege folder lists
#
# Identity / query
# ----------------
# - Custody identity: (collection_id, sha256)
# - Query: pre-filter to mounted collection_ids (+ privilege rules)
# - Citations: message_id / filename + collection_id when useful
#
# Loader validation (scripts/workspace_config.py)
# -----------------------------------------------
# - schema_version == 2; unknown keys fail-loud (incl. kind, retrieval)
# - collection.id / workspace.id unique; exactly one active workspace
# - every mount id ∈ collections[]; paths under workspaces.dir; no overlap
# - privileged required bool
# - optional mount purposes: (R-05) restrict query.py --purpose TAG
#
# collections = physical facts (path under workspaces.dir)
# workspaces  = visibility mounts + matter folder

schema_version: 2

collections:
  - id: suan-svetlana
    title: "Spousal email (Suan ↔ Svetlana)"
    description: >
      Spousal email correspondence. Majority Russian. Separation, parenting,
      finances, property negotiation record.
    # Relative to workspaces.dir — shared facts store (read-only)
    path: corpora/suan-svetlana
    privileged: false

  - id: suan-solicitor
    title: "Own solicitor (privileged)"
    description: >
      Own-solicitor channel (attorney-client privileged). Advice and
      strategy — not for outward-facing drafts.
    # Privilege is registry privileged: true (and/or a path segment named
    # privileged/). Folder need not sit under corpora/privileged/.
    path: corpora/suan-solicitor
    privileged: true

  - id: svetlana-solicitor
    title: "Opposing counsel (Shore Lawyers)"
    description: >
      Opposing-counsel correspondence. Outward-facing formal record;
      allegations are instructed positions, not findings.
    path: corpora/svetlana-solicitor
    privileged: false

  - id: svetlana-financial-disclosure
    title: "Wife financial disclosure PDFs"
    description: >
      Wife's financial disclosure package (bank statements, loans, payslips,
      super, etc.) for property settlement and bank/ATO analysis.
    path: corpora/svetlana-financial-disclosure
    privileged: false

  - id: suan-financial-disclosure
    title: "Suan financial disclosure PDFs"
    description: >
      Suan's financial disclosure package for property settlement and
      related bank/ATO analysis.
    path: corpora/suan-financial-disclosure
    privileged: false

  # Structured-transactions scope (R-04b; unified 2026-07-16): EXPLICIT
  # marking. One bank account = one collection whose folder holds that
  # account's statement PDFs. It is a REAL collection (ingested,
  # mounted, searched like any other) and additionally its PDFs are
  # parsed into the transactions tables (transactions.py parse).
  # Regular collections may set `ingestion-type: general` (the default).
  - id: examplebank-personal-111222-334455   # stable id; label in reports
    ingestion-type: bank-transactions
    description: Person A personal account
    bsb: "111222"                     # QUOTED string; "" for cards
    account_number: "334455"          # QUOTED string (unquoted digits risk
                                      #   YAML octal/leading-zero mangling);
                                      #   cross-checked against what the
                                      #   statements print (misfile guard)
    owners: [person-a]                # >1 owner = joint account
    type: daily-transactions          # free vocabulary: business,
                                      #   home-loan, daily-transactions...
    path: "corpora/bank-accounts/examplebank-personal-111222-334455"

workspaces:
  - id: family-law
    active: true
    path: family-law
    title: "Family law matter"
    collections:
      - id: suan-svetlana
      - id: suan-solicitor
      - id: svetlana-solicitor
      - id: svetlana-financial-disclosure
      - id: suan-financial-disclosure
      # bank-account collections mount like any other; transactions.py
      # parse only covers accounts mounted on the ACTIVE workspace
      - id: examplebank-personal-111222-334455

  - id: personal-finance
    active: false
    path: personal-finance
    title: "Personal finance / bank statements / ATO"
    # R-05: optional purpose tags restrict query.py --purpose TAG
    collections:
      - id: svetlana-financial-disclosure
        purposes: [disclosure, settlement]
      - id: suan-financial-disclosure
        purposes: [disclosure, settlement]
