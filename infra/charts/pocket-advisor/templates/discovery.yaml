{{/*
Discovery: the sole entry point and the only component that mints root
documents (§5.2). Three shapes, one binary.
*/}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-discovery
  labels:
    {{- include "pa.labels" . | nindent 4 }}
    app.kubernetes.io/component: discovery
    app: discovery
spec:
  replicas: {{ .Values.discovery.replicaCount }}
  selector:
    matchLabels:
      app: discovery
  template:
    metadata:
      labels:
        {{- include "pa.labels" . | nindent 8 }}
        app: discovery
      annotations:
        {{- include "pa.metricsAnnotations" (dict "port" .Values.discovery.metricsPort) | nindent 8 }}
    spec:
      containers:
        - name: discovery
          image: {{ .Values.discovery.image }}
          imagePullPolicy: {{ .Values.workers.imagePullPolicy }}
          args:
            - "--mode=serve"
            - "--http-port={{ .Values.discovery.httpPort }}"
          ports:
            - containerPort: {{ .Values.discovery.metricsPort }}
              name: metrics
            - containerPort: {{ .Values.discovery.httpPort }}
              name: http
          env:
            {{- include "pa.natsEnv" . | nindent 12 }}
            {{- include "pa.postgresEnv" . | nindent 12 }}
            {{- include "pa.minioWorkerEnv" . | nindent 12 }}
            {{- include "pa.commonEnv" . | nindent 12 }}
            - name: METRICS_PORT
              value: "{{ .Values.discovery.metricsPort }}"
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            {{- toYaml .Values.discovery.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-discovery
  labels:
    {{- include "pa.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.discovery.httpPort }}
      targetPort: http
      name: http
    - port: {{ .Values.discovery.metricsPort }}
      targetPort: metrics
      name: metrics
  selector:
    app: discovery
---
{{/*
Reconciler: re-publishes documents whose stub committed but whose command
never reached NATS (§2.2). Safe to run repeatedly because doc_id is
deterministic and every worker is idempotent on it.
*/}}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .Release.Name }}-reconciler
  labels:
    {{- include "pa.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.discovery.reconcile.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            {{- include "pa.labels" . | nindent 12 }}
        spec:
          restartPolicy: OnFailure
          containers:
            - name: reconciler
              image: {{ .Values.discovery.image }}
              imagePullPolicy: {{ .Values.workers.imagePullPolicy }}
              args:
                - "--mode=reconcile"
                - "--stale-after={{ .Values.discovery.reconcile.staleAfter }}"
              env:
                {{- include "pa.natsEnv" . | nindent 16 }}
                {{- include "pa.postgresEnv" . | nindent 16 }}
                {{- include "pa.minioWorkerEnv" . | nindent 16 }}
                {{- include "pa.commonEnv" . | nindent 16 }}
              resources:
                {{- toYaml .Values.discovery.resources | nindent 16 }}
{{- if .Values.discovery.scan.enabled }}
---
{{/*
Bucket scan: the exact reconciliation of raw/ against Tier 2 (§5.2). Run it
after every upload. A Job rather than a loop in the Deployment, because two
replicas enumerating the same prefix would duplicate work.

Enable with --set discovery.scan.enabled=true --set discovery.scan.workspace=<id>
*/}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-discovery-scan
  labels:
    {{- include "pa.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: 2
  template:
    metadata:
      labels:
        {{- include "pa.labels" . | nindent 8 }}
    spec:
      restartPolicy: OnFailure
      containers:
        - name: discovery-scan
          image: {{ .Values.discovery.image }}
          imagePullPolicy: {{ .Values.workers.imagePullPolicy }}
          args:
            - "--mode=scan"
            - "--workspace={{ required "discovery.scan.workspace is required when the scan is enabled" .Values.discovery.scan.workspace }}"
            # The scan can outrun the whole pipeline: listing a bucket enqueues
            # far faster than OCR drains (§5.2).
            - "--high-water={{ .Values.discovery.scan.highWater }}"
            - "--low-water={{ .Values.discovery.scan.lowWater }}"
          env:
            {{- include "pa.natsEnv" . | nindent 12 }}
            {{- include "pa.postgresEnv" . | nindent 12 }}
            {{- include "pa.minioWorkerEnv" . | nindent 12 }}
            {{- include "pa.commonEnv" . | nindent 12 }}
          resources:
            {{- toYaml .Values.discovery.resources | nindent 12 }}
{{- end }}
