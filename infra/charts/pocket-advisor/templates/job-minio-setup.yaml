{{/*
Creates the bucket, the two scoped identities, and the bucket notification
that makes discovery's live path work.

Runs as a post-install/post-upgrade hook before anything else, because both
the write-authority split (§5.1) and the notification path (§5.2) have to
exist before a single object lands.

Policy documents are rendered by Helm rather than assembled in the container:
the minio/mc image is a near-empty distroless-style image with no sed, awk or
envsubst, and the bucket name is known at render time anyway.
*/}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-minio-setup
  labels:
    {{- include "pa.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 10
  template:
    metadata:
      labels:
        {{- include "pa.labels" . | nindent 8 }}
    spec:
      restartPolicy: OnFailure
      volumes:
        - name: policies
          configMap:
            name: {{ .Release.Name }}-minio-policies
      containers:
        - name: mc
          image: {{ .Values.minio.mcImage }}
          volumeMounts:
            - name: policies
              mountPath: /policies
              readOnly: true
          env:
            - name: MC_HOST_local
              value: "http://{{ .Values.minio.credentials.rootUser }}:{{ .Values.minio.credentials.rootPassword }}@{{ .Release.Name }}-minio:{{ .Values.minio.apiPort }}"
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              echo "waiting for minio"
              until mc ls local >/dev/null 2>&1; do sleep 2; done

              # Every step is idempotent: this hook re-runs on every
              # `helm upgrade`, so "already exists" must be success, not
              # failure. Errors are never swallowed wholesale — a genuinely
              # broken policy has to surface here rather than as an auth
              # failure in a worker three minutes later.
              #
              # Shell builtins only: the minio/mc image ships no sed, grep or
              # awk, so `case` is the pattern match available.
              ensure() {
                desc="$1"; shift
                if out=$("$@" 2>&1); then
                  echo "ok: $desc"
                  return 0
                fi
                case "$out" in
                  *already*|*Already*|*"in effect"*|*"no net effect"*)
                    echo "ok: $desc (already applied)"
                    return 0 ;;
                esac
                echo "FAILED: $desc"
                echo "$out"
                return 1
              }

              ensure "bucket" mc mb --ignore-existing local/{{ .Values.minio.bucket }}

              ensure "policy pa-worker"   mc admin policy create local pa-worker   /policies/worker.json
              ensure "policy pa-uploader" mc admin policy create local pa-uploader /policies/uploader.json

              ensure "user pa-worker"   mc admin user add local {{ .Values.minio.credentials.workerAccessKey }}   {{ .Values.minio.credentials.workerSecretKey }}
              ensure "user pa-uploader" mc admin user add local {{ .Values.minio.credentials.uploaderAccessKey }} {{ .Values.minio.credentials.uploaderSecretKey }}

              ensure "attach pa-worker"   mc admin policy attach local pa-worker   --user {{ .Values.minio.credentials.workerAccessKey }}
              ensure "attach pa-uploader" mc admin policy attach local pa-uploader --user {{ .Values.minio.credentials.uploaderAccessKey }}

              {{- if .Values.discovery.bucketNotification.enabled }}
              # Bucket notification: discovery's live path (§5.2). A dropped
              # event costs a delay, not a document — the bucket scan is an
              # exact backstop.
              mc event add local/{{ .Values.minio.bucket }} \
                arn:minio:sqs::DISCOVERY:webhook \
                --event put --prefix workspaces/ 2>/dev/null || \
                echo "notification already registered"
              {{- end }}

              echo "minio setup complete"
          resources:
            requests: {cpu: "50m", memory: "64Mi"}
            limits:   {cpu: "200m", memory: "128Mi"}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-minio-policies
  labels:
    {{- include "pa.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "-11"
    "helm.sh/hook-delete-policy": before-hook-creation
data:
  # Worker identity: read anywhere, write ONLY under extracted/, never delete.
  # This is the enforcement point for the write-authority split — a worker that
  # tries to write raw/ is refused by MinIO, not by a code-level guard (§5.1).
  worker.json: |
    {
      "Version": "2012-10-17",
      "Statement": [
        {
          "Effect": "Allow",
          "Action": ["s3:GetBucketLocation", "s3:ListBucket"],
          "Resource": ["arn:aws:s3:::{{ .Values.minio.bucket }}"]
        },
        {
          "Effect": "Allow",
          "Action": ["s3:GetObject"],
          "Resource": ["arn:aws:s3:::{{ .Values.minio.bucket }}/*"]
        },
        {
          "Effect": "Allow",
          "Action": ["s3:PutObject"],
          "Resource": ["arn:aws:s3:::{{ .Values.minio.bucket }}/workspaces/*/extracted/*"]
        }
      ]
    }
  # Uploader identity: full control, including delete (needed for --wipe).
  uploader.json: |
    {
      "Version": "2012-10-17",
      "Statement": [
        {
          "Effect": "Allow",
          "Action": ["s3:*"],
          "Resource": [
            "arn:aws:s3:::{{ .Values.minio.bucket }}",
            "arn:aws:s3:::{{ .Values.minio.bucket }}/*"
          ]
        }
      ]
    }
