{{/*
nats-server.conf starts with no workspace accounts. --create-workspace adds
one by patching this ConfigMap and restarting the pod to pick it up
(workspace-isolation.md §8) — the chart's job is only to give NATS a config
file to have accounts patched into in the first place; it does not know the
workspace list itself (workspace-config.yaml is a CLI-only concern).

This is new authentication, not an upgrade: before this file existed, NATS
ran on bare CLI flags with no config, no accounts, no users — anyone who
could reach the ClusterIP had full access to everything.
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-nats-config
  labels:
    {{- include "pa.labels" . | nindent 4 }}
data:
  nats-server.conf: |
    port: {{ .Values.nats.clientPort }}
    http: {{ .Values.nats.monitorPort }}

    jetstream {
      store_dir: /data
    }

    # Workspace accounts are appended here by --create-workspace, one per
    # workspace, each with jetstream enabled and its own user
    # (workspace-isolation.md §2.3, §8). Empty until the first workspace
    # exists. The BEGIN/END markers are load-bearing — internal/provision's
    # addAccountBlock/removeAccountBlock locate them by exact text, not by
    # line position, so they must be preserved verbatim.
    accounts {
      # BEGIN-WORKSPACE-ACCOUNTS (managed by pocket-advisor --create-workspace)
      # END-WORKSPACE-ACCOUNTS
    }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-nats
  labels:
    {{- include "pa.labels" . | nindent 4 }}
    app.kubernetes.io/component: message-bus
spec:
  serviceName: {{ .Release.Name }}-nats
  replicas: {{ .Values.nats.replicaCount }}
  selector:
    matchLabels:
      app: nats
  template:
    metadata:
      labels:
        app: nats
    spec:
      containers:
        - name: nats
          image: {{ .Values.nats.image }}
          command:
            - nats-server
            - "-c"
            - "/etc/nats/nats-server.conf"
          ports:
            - containerPort: {{ .Values.nats.clientPort }}
            - containerPort: {{ .Values.nats.monitorPort }}
          resources:
            {{- toYaml .Values.nats.resources | nindent 12 }}
          volumeMounts:
            - name: nats-data
              mountPath: /data
            - name: nats-config
              mountPath: /etc/nats
              readOnly: true
      volumes:
        - name: nats-config
          configMap:
            name: {{ .Release.Name }}-nats-config
  volumeClaimTemplates:
    - metadata:
        name: nats-data
      spec:
        accessModes: [ "ReadWriteOnce" ]
        resources:
          requests:
            storage: {{ .Values.nats.persistence.size }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-nats
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.nats.clientPort }}
      targetPort: {{ .Values.nats.clientPort }}
      name: client
    - port: {{ .Values.nats.monitorPort }}
      targetPort: {{ .Values.nats.monitorPort }}
      name: monitor
  selector:
    app: nats
