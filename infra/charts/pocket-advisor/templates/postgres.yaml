apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-postgres
  labels:
    {{- include "pa.labels" . | nindent 4 }}
    app.kubernetes.io/component: database
spec:
  serviceName: {{ .Release.Name }}-postgres
  replicas: {{ .Values.postgres.replicaCount }}
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          ports:
            - containerPort: {{ .Values.postgres.port }}
          env:
            # No POSTGRES_DB: every workspace gets its own database
            # (--create-workspace, workspace-isolation.md §6) and admin
            # operations use Postgres's own built-in `postgres` maintenance
            # database (infra.postgres.admin_dsn) — nothing needs a
            # dedicated bootstrap database created here.
            - name: POSTGRES_USER
              value: {{ .Values.postgres.credentials.user }}
            - name: POSTGRES_PASSWORD
              value: {{ .Values.postgres.credentials.password }}
          resources:
            {{- toYaml .Values.postgres.resources | nindent 12 }}
          volumeMounts:
            # Postgres 18's image restructured its volume layout to support
            # pg_upgrade: PGDATA now lives in a version-named subdirectory
            # under this mount rather than at its root (docker-library/
            # postgres#1259). Mounting directly at .../data, as pg16 wanted,
            # makes every pg18+ container refuse to start.
            - name: postgres-data
              mountPath: /var/lib/postgresql
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes: [ "ReadWriteOnce" ]
        resources:
          requests:
            storage: {{ .Values.postgres.persistence.size }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-postgres
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.postgres.port }}
      targetPort: {{ .Values.postgres.port }}
      name: postgres
  selector:
    app: postgres
