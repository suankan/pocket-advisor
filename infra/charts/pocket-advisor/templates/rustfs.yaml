apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-rustfs
  labels:
    {{- include "pa.labels" . | nindent 4 }}
    app.kubernetes.io/component: object-store
spec:
  serviceName: {{ .Release.Name }}-rustfs
  replicas: {{ .Values.rustfs.replicaCount }}
  selector:
    matchLabels:
      app: rustfs
  template:
    metadata:
      labels:
        app: rustfs
    spec:
      containers:
        - name: rustfs
          image: {{ .Values.rustfs.image }}
          ports:
            - containerPort: {{ .Values.rustfs.apiPort }}
            - containerPort: {{ .Values.rustfs.consolePort }}
          env:
            - name: RUSTFS_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-credentials
                  key: rustfs-root-user
            - name: RUSTFS_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-credentials
                  key: rustfs-root-password
            {{- if .Values.rustfs.notify.nats.enabled }}
            # Live event delivery test (§5.2): RustFS's native NATS JetStream
            # notify target, scoped to one workspace (see values.yaml's
            # comment on rustfs.notify.nats for why this isn't per-workspace
            # yet). Three deployment-config fixes required, all found by live
            # testing against beta.12, none of them code changes:
            #   1. RUSTFS_NOTIFY_ENABLE — a separate top-level module gate;
            #      without it no target is constructed at all, silently.
            #   2. RUSTFS_NOTIFY_NATS_QUEUE_DIR_PRIMARY — the default
            #      (/opt/rustfs/events) is unwritable by RustFS's non-root
            #      user (§12 bug 1, same bug class as the webhook target).
            #   3. The target JetStream stream's duplicate_window must
            #      exceed RustFS's retry lifetime (~274s observed) — see
            #      internal/bus.go's RUSTFS_EVENTS stream, created with a
            #      10m window for exactly this.
            - name: RUSTFS_NOTIFY_ENABLE
              value: "true"
            - name: RUSTFS_NOTIFY_NATS_ENABLE_PRIMARY
              value: "on"
            - name: RUSTFS_NOTIFY_NATS_ADDRESS_PRIMARY
              value: {{ .Values.rustfs.notify.nats.address | quote }}
            - name: RUSTFS_NOTIFY_NATS_SUBJECT_PRIMARY
              value: {{ .Values.rustfs.notify.nats.subject | quote }}
            - name: RUSTFS_NOTIFY_NATS_USERNAME_PRIMARY
              value: {{ .Values.rustfs.notify.nats.workspaceId | quote }}
            - name: RUSTFS_NOTIFY_NATS_PASSWORD_PRIMARY
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-credentials
                  key: rustfs-notify-nats-password
            - name: RUSTFS_NOTIFY_NATS_JETSTREAM_ENABLE_PRIMARY
              value: "on"
            - name: RUSTFS_NOTIFY_NATS_JETSTREAM_STREAM_NAME_PRIMARY
              value: {{ .Values.rustfs.notify.nats.jetstreamStreamName | quote }}
            - name: RUSTFS_NOTIFY_NATS_QUEUE_DIR_PRIMARY
              value: {{ .Values.rustfs.notify.nats.queueDir | quote }}
            {{- else }}
            # Bucket-notification target disabled (rustfs.notify.nats.enabled
            # is false). Ingestion falls back to `pocket-advisor --scan`,
            # which now touches unprocessed objects (a same-source/dest
            # server-side copy) rather than processing them directly, so it
            # still relies on this target being enabled to actually pick the
            # resulting event up (§5.2).
            {{- end }}
          resources:
            {{- toYaml .Values.rustfs.resources | nindent 12 }}
          volumeMounts:
            - name: rustfs-data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: rustfs-data
      spec:
        accessModes: [ "ReadWriteOnce" ]
        resources:
          requests:
            storage: {{ .Values.rustfs.persistence.size }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-rustfs
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.rustfs.apiPort }}
      targetPort: {{ .Values.rustfs.apiPort }}
      name: api
    - port: {{ .Values.rustfs.consolePort }}
      targetPort: {{ .Values.rustfs.consolePort }}
      name: console
  selector:
    app: rustfs
