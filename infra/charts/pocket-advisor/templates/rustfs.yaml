apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-rustfs
  labels:
    {{- include "pa.labels" . | nindent 4 }}
    app.kubernetes.io/component: object-store
spec:
  serviceName: {{ .Release.Name }}-rustfs
  replicas: {{ .Values.rustfs.replicaCount }}
  selector:
    matchLabels:
      app: rustfs
  template:
    metadata:
      labels:
        app: rustfs
    spec:
      containers:
        - name: rustfs
          image: {{ .Values.rustfs.image }}
          ports:
            - containerPort: {{ .Values.rustfs.apiPort }}
            - containerPort: {{ .Values.rustfs.consolePort }}
          env:
            - name: RUSTFS_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-credentials
                  key: rustfs-root-user
            - name: RUSTFS_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-credentials
                  key: rustfs-root-password
            # No bucket-notification wiring. Ingestion is driven by
            # `pocket-advisor --ingest-all`, which compares raw/ against Tier 2
            # and enqueues the difference; with no long-running consumer in the
            # cluster there is nothing for a webhook to deliver to between runs
            # (§5.2). This also retires the notify-subsystem workarounds that
            # rustfs/rustfs#5387 required.
          resources:
            {{- toYaml .Values.rustfs.resources | nindent 12 }}
          volumeMounts:
            - name: rustfs-data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: rustfs-data
      spec:
        accessModes: [ "ReadWriteOnce" ]
        resources:
          requests:
            storage: {{ .Values.rustfs.persistence.size }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-rustfs
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.rustfs.apiPort }}
      targetPort: {{ .Values.rustfs.apiPort }}
      name: api
    - port: {{ .Values.rustfs.consolePort }}
      targetPort: {{ .Values.rustfs.consolePort }}
      name: console
  selector:
    app: rustfs
