apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-credentials
  labels:
    {{- include "pa.labels" . | nindent 4 }}
type: Opaque
stringData:
  # MinIO root, used only by the setup Job to create the two scoped identities.
  minio-root-user: {{ .Values.minio.credentials.rootUser | quote }}
  minio-root-password: {{ .Values.minio.credentials.rootPassword | quote }}

  # Uploader identity: the only credentials permitted to write raw/ or delete
  # anything (§5.1).
  minio-uploader-access-key: {{ .Values.minio.credentials.uploaderAccessKey | quote }}
  minio-uploader-secret-key: {{ .Values.minio.credentials.uploaderSecretKey | quote }}

  # Worker identity: read anywhere, write only under extracted/.
  minio-worker-access-key: {{ .Values.minio.credentials.workerAccessKey | quote }}
  minio-worker-secret-key: {{ .Values.minio.credentials.workerSecretKey | quote }}

  postgres-user: {{ .Values.postgres.credentials.user | quote }}
  postgres-password: {{ .Values.postgres.credentials.password | quote }}
  postgres-dsn: {{ printf "postgres://%s:%s@%s-postgres:%d/%s?sslmode=disable"
      .Values.postgres.credentials.user
      .Values.postgres.credentials.password
      .Release.Name
      (int .Values.postgres.port)
      .Values.postgres.credentials.db | quote }}
