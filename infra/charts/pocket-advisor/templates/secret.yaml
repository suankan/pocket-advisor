apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-credentials
  labels:
    {{- include "pa.labels" . | nindent 4 }}
type: Opaque
stringData:
  # RustFS root, used only by the setup Job to create the two scoped identities.
  rustfs-root-user: {{ .Values.rustfs.credentials.rootUser | quote }}
  rustfs-root-password: {{ .Values.rustfs.credentials.rootPassword | quote }}

  # Uploader identity: the only credentials permitted to write raw/ or delete
  # anything (§5.1).
  rustfs-uploader-access-key: {{ .Values.rustfs.credentials.uploaderAccessKey | quote }}
  rustfs-uploader-secret-key: {{ .Values.rustfs.credentials.uploaderSecretKey | quote }}

  # Worker identity: read anywhere, write only under extracted/.
  rustfs-worker-access-key: {{ .Values.rustfs.credentials.workerAccessKey | quote }}
  rustfs-worker-secret-key: {{ .Values.rustfs.credentials.workerSecretKey | quote }}

  postgres-user: {{ .Values.postgres.credentials.user | quote }}
  postgres-password: {{ .Values.postgres.credentials.password | quote }}
  postgres-dsn: {{ printf "postgres://%s:%s@%s-postgres:%d/%s?sslmode=disable"
      .Values.postgres.credentials.user
      .Values.postgres.credentials.password
      .Release.Name
      (int .Values.postgres.port)
      .Values.postgres.credentials.db | quote }}
