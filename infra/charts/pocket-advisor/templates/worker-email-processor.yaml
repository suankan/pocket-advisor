{{/*
Email processor: unrolls MIME structures and archive containers in RAM (§5.3).
Writes extracted children to Tier 1 under extracted/, which is the one prefix
the worker identity is permitted to write.
*/}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-email-processor-worker
  labels:
    {{- include "pa.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
    app: email-processor-worker
spec:
  replicas: {{ .Values.workers.emailProcessor.replicaCount }}
  selector:
    matchLabels:
      app: email-processor-worker
  template:
    metadata:
      labels:
        {{- include "pa.labels" . | nindent 8 }}
        app: email-processor-worker
      annotations:
        {{- include "pa.metricsAnnotations" (dict "port" .Values.workers.emailProcessor.metricsPort) | nindent 8 }}
    spec:
      containers:
        - name: email-processor-worker
          image: {{ .Values.workers.emailProcessor.image }}
          imagePullPolicy: {{ .Values.workers.imagePullPolicy }}
          ports:
            - containerPort: {{ .Values.workers.emailProcessor.metricsPort }}
              name: metrics
          env:
            {{- include "pa.natsEnv" . | nindent 12 }}
            {{- include "pa.postgresEnv" . | nindent 12 }}
            {{- include "pa.minioWorkerEnv" . | nindent 12 }}
            {{- include "pa.commonEnv" . | nindent 12 }}
            - name: METRICS_PORT
              value: "{{ .Values.workers.emailProcessor.metricsPort }}"
          resources:
            {{- toYaml .Values.workers.emailProcessor.resources | nindent 12 }}
