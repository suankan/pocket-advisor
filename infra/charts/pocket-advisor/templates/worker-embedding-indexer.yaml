{{/*
Embedding indexer: chunk, embed, persist (§5.6).

Reads normalized_text from Tier 2 by doc_id — the command carries a reference,
not the text (§4.1) — so this is the one worker that needs no object-store
access at all.

It re-probes the embedding endpoint at startup and exits if the dimension
disagrees with what the index was built for. That is deliberate: a worker
embedding at one dimension into a column sized for another writes vectors that
are silently not comparable to their neighbours (§4.4).
*/}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-embedding-indexer-worker
  labels:
    {{- include "pa.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
    app: embedding-indexer-worker
spec:
  replicas: {{ .Values.workers.embeddingIndexer.replicaCount }}
  selector:
    matchLabels:
      app: embedding-indexer-worker
  template:
    metadata:
      labels:
        {{- include "pa.labels" . | nindent 8 }}
        app: embedding-indexer-worker
      annotations:
        {{- include "pa.metricsAnnotations" (dict "port" .Values.workers.embeddingIndexer.metricsPort) | nindent 8 }}
    spec:
      containers:
        - name: embedding-indexer-worker
          image: {{ .Values.workers.embeddingIndexer.image }}
          imagePullPolicy: {{ .Values.workers.imagePullPolicy }}
          ports:
            - containerPort: {{ .Values.workers.embeddingIndexer.metricsPort }}
              name: metrics
          env:
            {{- include "pa.natsEnv" . | nindent 12 }}
            {{- include "pa.postgresEnv" . | nindent 12 }}
            {{- include "pa.embeddingEnv" . | nindent 12 }}
            {{- include "pa.commonEnv" . | nindent 12 }}
            - name: METRICS_PORT
              value: "{{ .Values.workers.embeddingIndexer.metricsPort }}"
          resources:
            {{- toYaml .Values.workers.embeddingIndexer.resources | nindent 12 }}
