# ============================================================================
# Global & Environment Settings
# ============================================================================
global:
  namespace: pocket-advisor
  environment: local
  logLevel: info

# ============================================================================
# Tier 1: RustFS Object Storage — the SOLE source of truth
#
# User filesystems are a staging feed into this bucket, never read by the
# system itself (ingestion-design.md §5.1).
#
# Migrated from MinIO: MinIO's Community Edition has been progressively
# stripped of features since mid-2025 and the project archived in Feb 2026.
# RustFS is Apache-2.0 and deliberately implements MinIO's admin wire
# protocol (/minio/admin/v3), so `mc admin` tooling and our whole scoped-
# identity model carry over unchanged.
#
# Pinned to beta.12, not latest: beta.9 introduced a boot-order race where
# init_event_notifier() unconditionally refreshed notify config from storage
# before checking whether notify was even enabled, throwing "storage layer
# not initialized" whenever storage wasn't ready yet at that exact moment.
# Fixed in beta.12 (rustfs/rustfs commit 775279b6f, "defer disabled bootstrap
# storage refresh") for the disabled-notify case; beta.9-beta.11 still carry
# it. Live-verified on beta.12 (docs/ingestion-design.md §5.2) with a scratch
# NATS+RustFS pair: clean boot, full object round trip, survived a restart.
# ============================================================================
rustfs:
  image: rustfs/rustfs:1.0.0-beta.12
  # Still `mc` — RustFS implements MinIO's admin API, so the same client
  # that talked to MinIO talks to RustFS unchanged.
  mcImage: minio/mc:RELEASE.2025-08-13T08-35-41Z
  replicaCount: 1
  apiPort: 9000
  consolePort: 9001
  bucket: pocket-advisor

  # Two scoped identities, not one. The uploader is the only writer to raw/
  # and the only identity that may delete; workers read anywhere but write
  # only under extracted/. Enforced by policy rather than convention
  # (§5.1) — see templates/job-rustfs-setup.yaml.
  credentials:
    rootUser: rustfsadmin
    rootPassword: rustfsadminpassword
    uploaderAccessKey: pa-uploader
    uploaderSecretKey: pa-uploader-secret
    workerAccessKey: pa-worker
    workerSecretKey: pa-worker-secret

  # Live event delivery test (docs/ingestion-design.md §5.2): RustFS's native
  # NATS JetStream notify target, publishing ObjectCreated/Updated directly
  # into NATS instead of the removed webhook path. Deliberately scoped to ONE
  # workspace for now, not auto-provisioned per workspace — RustFS is a
  # single shared server with one server-wide target config, but NATS
  # accounts are fully isolated subject spaces per workspace, so a single
  # target can only authenticate as one workspace's NATS user at a time.
  # Generalizing this to every workspace is explicit follow-up work.
  #
  # `natsPassword` is deliberately left empty here: it is that workspace's
  # own NATS credential (workspaces/workspace-config.yaml's nats_password for
  # workspaceId, itself gitignored) and must never be committed. Supply it at
  # deploy time, e.g.:
  #   helm upgrade ... --set rustfs.notify.nats.natsPassword=<value>
  notify:
    nats:
      enabled: false
      workspaceId: test
      # NATS user is always == workspace id (internal/provision/nats.go).
      address: "{{ .Release.Name }}-nats:4222"
      subject: rustfs.events.raw
      natsPassword: ""
      jetstreamStreamName: RUSTFS_EVENTS
      # Must exceed RustFS's observed retry lifetime (~274s) or RustFS
      # refuses to publish, live-verified — see internal/bus.go's stream
      # creation for RustFS_EVENTS, which sets this to match.
      jetstreamDedupWindow: 10m
      # Default (/opt/rustfs/events) is unwritable by RustFS's non-root
      # user — identical bug class already fixed for the webhook target
      # (§12 bug 1), same fix shape here.
      queueDir: /data/.rustfs-events-notify

  persistence:
    enabled: true
    # CHANGING THIS ON A LIVE RELEASE REQUIRES RECREATING THE STATEFULSET.
    # volumeClaimTemplates is immutable, so `helm upgrade` fails with
    # "updates to statefulset spec ... are forbidden". See the chart README.
    #
    # Measured corpus 2026-07-27: 559Mi raw + ~280Mi extracted children.
    # ~60x headroom: the matter is active, and re-ingestion writes new
    # extracted/ objects without reclaiming old ones (§6.4).
    size: 50Gi
  resources:
    requests: {cpu: "200m", memory: "256Mi"}
    limits:   {cpu: "500m", memory: "768Mi"}

# ============================================================================
# Pipeline Bus: NATS JetStream
# ============================================================================
nats:
  image: nats:2.14.3-alpine
  replicaCount: 1
  clientPort: 4222
  monitorPort: 8222
  persistence:
    enabled: true
    # Commands carry object references and doc_ids (~1Ki each), never document
    # text (§4.1). Sized for backlog depth, not document volume.
    size: 5Gi
  resources:
    requests: {cpu: "150m", memory: "128Mi"}
    limits:   {cpu: "300m", memory: "384Mi"}

# ============================================================================
# Tier 2 & 3: PostgreSQL + pgvector
# ============================================================================
postgres:
  # pgvector 0.8.5 on Postgres 18. A major-version bump changes the on-disk
  # data directory format, so this requires deleting the postgres PVC before
  # upgrading a live release — schema-bootstrap recreates the schema fresh.
  image: pgvector/pgvector:0.8.5-pg18-bookworm
  replicaCount: 1
  port: 5432
  credentials:
    user: postgres
    password: postgrespassword
  persistence:
    enabled: true
    # Steady state for the measured corpus is ~250Mi. The headroom is for
    # three transient operations, not the steady state: a re-embed holds two
    # embed_model namespaces at once, REINDEX needs ~2x the index, and
    # max_wal_size defaults to 1Gi regardless of corpus size (§6.4).
    size: 20Gi
  resources:
    requests: {cpu: "300m", memory: "512Mi"}
    limits:   {cpu: "1000m", memory: "1536Mi"}
