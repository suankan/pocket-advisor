apiVersion: v1
kind: ConfigMap
metadata:
  name: pocket-advisor-e2e-realm
  labels:
    app.kubernetes.io/component: e2e-keycloak
data:
  realm.json: |
    {
      "realm": "pocket-advisor",
      "enabled": true,
      "sslRequired": "none",
      "clients": [
        {
          "clientId": "pocket-advisor-opencode",
          "name": "OpenCode MCP client",
          "publicClient": true,
          "standardFlowEnabled": true,
          "directAccessGrantsEnabled": false,
          "redirectUris": ["http://127.0.0.1:19876/mcp/oauth/callback"],
          "webOrigins": ["+"],
          "protocol": "openid-connect",
          "attributes": { "pkce.code.challenge.method": "S256" },
          "defaultClientScopes": ["pocket-advisor:retrieve", "openid", "profile", "email"]
        },
        {
          "clientId": "pocket-advisor-resource-server",
          "name": "MCP resource server introspection client",
          "publicClient": false,
          "secret": "e2e-introspection-secret",
          "protocol": "openid-connect",
          "serviceAccountsEnabled": true,
          "defaultClientScopes": ["pocket-advisor:retrieve"]
        }
      ],
      "clientScopes": [
        {
          "name": "pocket-advisor:retrieve",
          "protocol": "openid-connect",
          "attributes": { "include.in.token.scope": "true", "display.on.consent.screen": "true" },
          "protocolMappers": [
            {
              "name": "audience-mcp-resource",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-audience-mapper",
              "config": {
                "included.client.audience": "https://mcp.example.test/mcp",
                "id.token.claim": "false",
                "access.token.claim": "true"
              }
            }
          ]
        }
      ],
      "users": [
        {
          "username": "e2e-user",
          "enabled": true,
          "firstName": "End-to-End",
          "lastName": "Test",
          "email": "e2e@example.test",
          "emailVerified": true,
          "credentials": [{ "type": "password", "value": "e2e-password", "temporary": false }],
          "realmRoles": ["offline_access", "uma_authorization"]
        }
      ]
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pocket-advisor-e2e-keycloak
  labels:
    app.kubernetes.io/component: e2e-keycloak
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: e2e-keycloak
  template:
    metadata:
      labels:
        app.kubernetes.io/component: e2e-keycloak
    spec:
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:24.0.3
          args:
            - start
            - --http-enabled=true
            - --https-port=8443
            - --https-certificate-file=/etc/keycloak-tls/tls.crt
            - --https-certificate-key-file=/etc/keycloak-tls/tls.key
            - --hostname-strict=false
            - --import-realm
          env:
            - name: KEYCLOAK_ADMIN
              value: admin
            - name: KEYCLOAK_ADMIN_PASSWORD
              value: admin
          ports:
            - name: https
              containerPort: 8443
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: realm
              mountPath: /opt/keycloak/data/import
            - name: keycloak-tls
              mountPath: /etc/keycloak-tls
              readOnly: true
          readinessProbe:
            httpGet:
              path: /realms/master
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
      volumes:
        - name: realm
          configMap:
            name: pocket-advisor-e2e-realm
        - name: keycloak-tls
          secret:
            secretName: pocket-advisor-e2e-keycloak-tls
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  labels:
    app.kubernetes.io/component: e2e-keycloak
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/component: e2e-keycloak
  ports:
    - name: https
      port: 8443
      targetPort: 8443
