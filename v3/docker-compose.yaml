# Local development stack: the three stores, no workers.
#
# Brings up exactly what `uploader` needs (MinIO) plus what the rest of the
# pipeline needs when you start it (PostgreSQL + pgvector, NATS JetStream).
#
#   docker compose up -d
#   ./build/build-images.sh
#   docker run --rm --network v3_pocket-advisor \
#     -e MINIO_ENDPOINT=minio:9000 \
#     -e MINIO_ACCESS_KEY=minioadmin -e MINIO_SECRET_KEY=minioadminpassword \
#     -v /path/to/documents:/corpus:ro \
#     pocket-advisor/uploader:latest \
#     --workspace family-law --collection correspondence --source /corpus

name: v3

services:
  minio:
    image: minio/minio:RELEASE.2024-01-18T22-51-28Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # console
    volumes:
      - minio-data:/data
    networks: [pocket-advisor]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 12

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: rag_ingestion
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [pocket-advisor]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 12

  nats:
    image: nats:2.10-alpine
    command: ["-js", "-sd", "/data", "-m", "8222"]
    ports:
      - "4222:4222"   # client
      - "8222:8222"   # monitoring
    volumes:
      - nats-data:/data
    networks: [pocket-advisor]

volumes:
  minio-data:
  postgres-data:
  nats-data:

networks:
  pocket-advisor:
