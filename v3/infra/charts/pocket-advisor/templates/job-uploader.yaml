{{- if .Values.uploader.enabled }}
{{/*
Corpus uploader: moves a workspace's documents into Tier 1, which is the sole
source of truth (§5.1). The only writer to raw/, and the only workload that
mounts a user filesystem.

WHAT to upload comes from the workspace registry, not from flags. Two values
identify everything:

  uploader.workspace.config  path to workspaces/workspace-config.yaml
  uploader.workspace.id      which workspace in it

The registry's collection paths are relative to the registry file's own
directory, so the Job mounts that directory — registry and corpora together —
and the collections resolve exactly as they do on the host.

  helm upgrade pocket-advisor ./infra/charts/pocket-advisor \
    --set uploader.enabled=true \
    --set uploader.workspace.config=/abs/path/to/workspaces/workspace-config.yaml \
    --set uploader.workspace.id=case-documents-demo

The mount is readOnly. Source corpora are never written, renamed or deleted,
and that is enforced at the kernel rather than by a code-level guard.
*/}}
{{- $cfg := required "uploader.workspace.config is required (path to workspace-config.yaml)" .Values.uploader.workspace.config }}
{{- $wsid := required "uploader.workspace.id is required" .Values.uploader.workspace.id }}
{{- $dir := dir $cfg }}
{{- $file := base $cfg }}
apiVersion: batch/v1
kind: Job
metadata:
  # Name carries the run so repeated uploads do not collide with a completed
  # Job of the same name.
  name: {{ .Release.Name }}-uploader-{{ now | date "20060102150405" }}
  labels:
    {{- include "pa.labels" . | nindent 4 }}
    app.kubernetes.io/component: uploader
spec:
  backoffLimit: {{ .Values.uploader.backoffLimit }}
  ttlSecondsAfterFinished: {{ .Values.uploader.ttlSecondsAfterFinished }}
  template:
    metadata:
      labels:
        {{- include "pa.labels" . | nindent 8 }}
      annotations:
        {{- include "pa.metricsAnnotations" (dict "port" .Values.uploader.metricsPort) | nindent 8 }}
    spec:
      restartPolicy: OnFailure
      containers:
        - name: uploader
          image: {{ .Values.uploader.image }}
          imagePullPolicy: {{ .Values.workers.imagePullPolicy }}
          args:
            - "--workspace-config=/workspaces/{{ $file }}"
            - "--workspace-id={{ $wsid }}"
            - "--concurrency={{ .Values.uploader.concurrency }}"
            {{- if .Values.uploader.forget }}
            # Explicit removal. Absence from a later upload run never implies
            # deletion (§5.1).
            - "--forget={{ .Values.uploader.forget }}"
            - "--yes"
            {{- end }}
            {{- if .Values.uploader.dryRun }}
            - "--dry-run"
            {{- end }}
            {{- if .Values.uploader.wipe }}
            # A corpus reset: purges Tier 2 FIRST, so a failure to reach
            # Postgres leaves the bucket untouched (§5.1).
            - "--wipe"
            - "--yes"
            {{- end }}
          env:
            {{- include "pa.minioUploaderEnv" . | nindent 12 }}
            {{- include "pa.commonEnv" . | nindent 12 }}
            - name: METRICS_PORT
              value: "{{ .Values.uploader.metricsPort }}"
            {{- if or .Values.uploader.wipe .Values.uploader.forget }}
            {{- include "pa.postgresEnv" . | nindent 12 }}
            {{- end }}
          volumeMounts:
            - name: workspaces
              mountPath: /workspaces
              readOnly: true
          resources:
            {{- toYaml .Values.uploader.resources | nindent 12 }}
      volumes:
        - name: workspaces
          {{- if .Values.uploader.existingClaim }}
          persistentVolumeClaim:
            claimName: {{ .Values.uploader.existingClaim }}
            readOnly: true
          {{- else }}
          hostPath:
            path: {{ $dir | quote }}
            type: Directory
          {{- end }}
{{- end }}
