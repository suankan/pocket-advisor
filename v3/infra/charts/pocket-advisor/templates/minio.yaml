apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-minio
  labels:
    {{- include "pa.labels" . | nindent 4 }}
    app.kubernetes.io/component: object-store
spec:
  serviceName: {{ .Release.Name }}-minio
  replicas: {{ .Values.minio.replicaCount }}
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
    spec:
      containers:
        - name: minio
          image: {{ .Values.minio.image }}
          command:
            - minio
            - server
            - /data
            - --console-address
            - ":{{ .Values.minio.consolePort }}"
          ports:
            - containerPort: {{ .Values.minio.apiPort }}
            - containerPort: {{ .Values.minio.consolePort }}
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-credentials
                  key: minio-root-user
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-credentials
                  key: minio-root-password
            {{- if .Values.discovery.bucketNotification.enabled }}
            # Bucket notification target for discovery's live path (§5.2).
            # The event is registered against this ARN by the minio-setup Job.
            - name: MINIO_NOTIFY_WEBHOOK_ENABLE_DISCOVERY
              value: "on"
            - name: MINIO_NOTIFY_WEBHOOK_ENDPOINT_DISCOVERY
              value: "http://{{ .Release.Name }}-discovery:{{ .Values.discovery.httpPort }}/v1/notify"
            {{- end }}
          resources:
            {{- toYaml .Values.minio.resources | nindent 12 }}
          volumeMounts:
            - name: minio-data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: minio-data
      spec:
        accessModes: [ "ReadWriteOnce" ]
        resources:
          requests:
            storage: {{ .Values.minio.persistence.size }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-minio
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.minio.apiPort }}
      targetPort: {{ .Values.minio.apiPort }}
      name: api
    - port: {{ .Values.minio.consolePort }}
      targetPort: {{ .Values.minio.consolePort }}
      name: console
  selector:
    app: minio
