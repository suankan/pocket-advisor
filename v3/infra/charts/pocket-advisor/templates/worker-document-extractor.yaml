{{/*
Document extractor: consumes BOTH ingest.pdfs.raw and ingest.images.raw.

One pool rather than two, because both paths execute the same OCR engine
against the same finite CPU budget; separate pools would compete for cores
with no coordination (§5.4). This is also the only image carrying a C
toolchain, and the only one where memory is governed by rasterisation rather
than by document size.
*/}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-document-extractor-worker
  labels:
    {{- include "pa.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
    app: document-extractor-worker
spec:
  replicas: {{ .Values.workers.documentExtractor.replicaCount }}
  selector:
    matchLabels:
      app: document-extractor-worker
  template:
    metadata:
      labels:
        {{- include "pa.labels" . | nindent 8 }}
        app: document-extractor-worker
      annotations:
        {{- include "pa.metricsAnnotations" (dict "port" .Values.workers.documentExtractor.metricsPort) | nindent 8 }}
    spec:
      containers:
        - name: document-extractor-worker
          image: {{ .Values.workers.documentExtractor.image }}
          imagePullPolicy: {{ .Values.workers.imagePullPolicy }}
          args:
            # Process-wide, not per-document: OCR is the CPU bottleneck and
            # page bitmaps are the memory hot spot (§5.4).
            - "--ocr-concurrency={{ .Values.workers.documentExtractor.ocrConcurrency }}"
            - "--pdf-instances={{ .Values.workers.documentExtractor.pdfInstances }}"
            # A missing language does not error — it silently produces
            # plausible-looking garbage that reaches the index.
            - "--ocr-langs={{ .Values.workers.documentExtractor.ocrLangs }}"
          ports:
            - containerPort: {{ .Values.workers.documentExtractor.metricsPort }}
              name: metrics
          env:
            {{- include "pa.natsEnv" . | nindent 12 }}
            {{- include "pa.postgresEnv" . | nindent 12 }}
            {{- include "pa.minioWorkerEnv" . | nindent 12 }}
            {{- include "pa.commonEnv" . | nindent 12 }}
            - name: METRICS_PORT
              value: "{{ .Values.workers.documentExtractor.metricsPort }}"
          resources:
            {{- toYaml .Values.workers.documentExtractor.resources | nindent 12 }}
