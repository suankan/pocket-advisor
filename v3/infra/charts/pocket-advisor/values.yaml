# ============================================================================
# Global & Environment Settings
# ============================================================================
global:
  namespace: pocket-advisor
  environment: local

# ============================================================================
# Tier 1: MinIO Object Storage
# ============================================================================
minio:
  image: minio/minio:RELEASE.2024-01-18T22-51-28Z
  replicaCount: 1
  apiPort: 9000
  consolePort: 9001
  credentials:
    accessKey: minioadmin
    secretKey: minioadminpassword
  persistence:
    enabled: true
    # Tier 1 is the SOLE source of truth (ingestion-design.md §5.1, §6.3).
    # Measured corpus 2026-07-27: 559Mi raw + ~280Mi extracted children.
    # ~60x headroom: the matter is active, and re-ingestion writes new
    # extracted/ objects without reclaiming old ones.
    size: 50Gi
  resources:
    requests:
      cpu: "200m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "768Mi"

# ============================================================================
# Pipeline Bus: NATS JetStream
# ============================================================================
nats:
  image: nats:2.10-alpine
  replicaCount: 1
  clientPort: 4222
  monitorPort: 8222
  persistence:
    enabled: true
    # Commands carry object references and doc_ids (~1Ki each), never document
    # text (ingestion-design.md §4.1). Sized for backlog depth, not document
    # volume: a 100k-message backlog is ~100Mi, and WorkQueue deletes on ack.
    size: 5Gi
  resources:
    requests:
      cpu: "150m"
      memory: "128Mi"
    limits:
      cpu: "300m"
      memory: "384Mi"

# ============================================================================
# Tier 2 & 3: PostgreSQL + pgvector
# ============================================================================
postgres:
  image: pgvector/pgvector:pg16
  replicaCount: 1
  port: 5432
  credentials:
    db: rag_ingestion
    user: postgres
    password: postgrespassword
  persistence:
    enabled: true
    # Tier 2 + Tier 3. Steady state for the measured corpus is ~250Mi
    # (ingestion-design.md §6.3). The headroom is for three transient
    # operations, not the steady state: a re-embed holds two embed_model
    # namespaces at once, REINDEX needs ~2x the index, and max_wal_size
    # defaults to 1Gi regardless of corpus size.
    size: 20Gi
  resources:
    requests:
      cpu: "300m"
      memory: "512Mi"
    limits:
      cpu: "1000m"
      memory: "1536Mi"

# ============================================================================
# Worker Pipeline Deployments (Total Budget: 6 Cores / 8 GB RAM)
# ============================================================================
workers:
  imagePullPolicy: IfNotPresent

  emailProcessor:
    image: pocket-advisor/email-processor-worker:latest
    replicaCount: 2
    metricsPort: 9090
    resources:
      requests:
        cpu: "150m"
        memory: "128Mi"
      limits:
        cpu: "500m"
        memory: "256Mi"

  pdfExtractor:
    image: pocket-advisor/pdf-extractor-worker:latest
    replicaCount: 3  # 3 x 1.0 CPU = 3.0 Cores limit for OCR/PDFium
    metricsPort: 9090
    resources:
      requests:
        cpu: "400m"
        memory: "384Mi"
      limits:
        cpu: "1000m"
        memory: "1024Mi"

  embeddingIndexer:
    image: pocket-advisor/embedding-indexer-worker:latest
    replicaCount: 2
    metricsPort: 9090
    embeddingApiUrl: "http://embedding-model-service.pocket-advisor.svc.cluster.local:8080/v1/embeddings"
    resources:
      requests:
        cpu: "200m"
        memory: "256Mi"
      limits:
        cpu: "500m"
        memory: "512Mi"
